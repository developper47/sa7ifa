<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الصحيفة — جريدة عربية مستقلة للفكر والتحليل">
  <title>الصحيفة — الرئيسية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css?v=3.4">
  <link rel="stylesheet" href="css/pages.css?v=3.4">
  <link rel="stylesheet" href="css/newspaper_slider.css?v=1.0">
  <!-- Google Fonts for newspaper style -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* ── Body override for slider mode ─────────────────── */
    body { overflow-x: hidden; overflow-y: auto; min-height: 100vh; display: flex; flex-direction: column; }
    .site-header { flex-shrink: 0; }
    .nws-slider { height: 85vh; min-height: 600px; flex-shrink: 0; }
    
    /* ── Custom Newspaper Layout Overrides ── */
    .nws-page {
      font-family: 'Noto Naskh Arabic', serif;
      color: #2B2B2B;
      background-color: #F4F1EA;
      background-image: repeating-linear-gradient(
        transparent 0px, transparent 26px,
        rgba(43,43,43,0.015) 26px, rgba(43,43,43,0.015) 27px
      );
      border: 4px double #2B2B2B !important;
      padding: 16px !important;
      max-width: 1100px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15), inset 0 0 100px rgba(43,43,43,0.05);
    }
    
    .headline-font {
      font-family: 'Amiri', serif;
    }
    
    .cairo-font {
      font-family: 'Cairo', sans-serif;
    }

    /* Traditional drop cap */
    .lettrine::first-letter {
      font-size: 3.5rem;
      float: right;
      line-height: 0.85;
      margin-left: 0.5rem;
      margin-top: 0.2rem;
      font-weight: 700;
      color: #2B2B2B;
      font-family: 'Amiri', serif;
    }

    /* High-contrast grayscale/sepia filter & 1px border */
    .vintage-image {
      filter: grayscale(100%) contrast(120%) !important;
      border: 1px solid #2B2B2B !important;
      padding: 2px;
      background-color: #F4F1EA;
      transition: filter 0.3s ease, transform 0.3s ease;
    }
    
    .vintage-image:hover {
      filter: grayscale(20%) contrast(110%) !important;
      transform: scale(1.02);
    }
    
    /* Boxed read more links */
    .read-more-btn {
      display: inline-block;
      border: 1px solid #2B2B2B;
      padding: 4px 8px;
      background-color: #F4F1EA;
      color: #2B2B2B;
      font-size: 0.8rem;
      font-weight: bold;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    
    .read-more-btn:hover {
      background-color: #2B2B2B;
      color: #F4F1EA;
      text-decoration: none;
    }
    
    .na-title-btn {
      transition: color 0.2s;
    }
    .na-title-btn:hover {
      color: #9b1a1a;
    }

    /* --- Grid & Layout System --- */
    .grid-3-col {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .grid-3-col {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .col-divider-left {
        border-left: 1px solid #2B2B2B;
        padding-left: 1.5rem;
      }
      .col-divider-right {
        padding-right: 1.5rem;
      }
      .col-divider-both {
        border-left: 1px solid #2B2B2B;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }
    
    .flex-row-md {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    @media (min-width: 768px) {
      .flex-row-md {
        flex-direction: row;
      }
    }
    
    .masthead-col {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 1rem;
    }
    @media (min-width: 768px) {
      .masthead-col {
        width: 33.333%;
        margin-bottom: 0;
      }
      .masthead-col-right {
        border-left: 1px solid rgba(43, 43, 43, 0.2);
        padding-left: 1rem;
        text-align: right;
      }
      .masthead-col-left {
        border-right: 1px solid rgba(43, 43, 43, 0.2);
        padding-right: 1rem;
        text-align: left;
      }
    }
    
    .text-center { text-align: center; }
    .text-justify { text-align: justify; }
    .text-right { text-align: right; }
    .text-left { text-align: left; }
    
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    
    .pt-3 { padding-top: 0.75rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    
    .border-b-double {
      border-bottom: 4px double #2B2B2B;
    }
    
    .border-t-double {
      border-top: 4px double #2B2B2B;
    }
    
    .border-dashed-top {
      border-top: 1px dashed rgba(43, 43, 43, 0.4);
    }
    
    .border-b-thin {
      border-bottom: 1px solid #2B2B2B;
    }
    
    .pb-6 { padding-bottom: 1.5rem; }
    
    .aspect-16-9 {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    
    .aspect-21-9 {
      width: 100%;
      aspect-ratio: 21/9;
      object-fit: cover;
    }
    
    .red-800 {
      color: #9b1a1a;
    }
  </style>
</head>
<body>

  <!-- ═══ FULL-PAGE NEWSPAPER SLIDER ═════════════════════ -->
  <div class="nws-slider" id="nwsSlider">

    <!-- Loading screen -->
    <div class="nws-loading" id="nwsLoading">
      <div class="nws-loading-inner">
        <div class="nws-loading-logo">الصحيفة</div>
        <div class="nws-loading-rule"></div>
        <p class="nws-loading-text">جارٍ طباعة الصحيفة…</p>
        <div class="nws-loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- Slide Track -->
    <div class="nws-track" id="nwsTrack"></div>

    <!-- Navigation Arrows -->
    <button class="nws-arrow nws-arrow--prev" id="nwsPrev" aria-label="السابق">&#8250;</button>
    <button class="nws-arrow nws-arrow--next" id="nwsNext" aria-label="التالي">&#8249;</button>

    <!-- Section name badge -->
    <div class="nws-section-badge" id="nwsSectionBadge"></div>

    <!-- Dot navigation -->
    <nav class="nws-dots" id="nwsDots" aria-label="تصفح الأقسام"></nav>

    <!-- Counter -->
    <div class="nws-counter" id="nwsCounter"></div>
  </div>

  <!-- ═══ ARTICLE MODAL — Double-page Book Spread ════════ -->
  <div class="nws-modal" id="nwsModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="nws-modal-backdrop" id="nwsModalBackdrop"></div>
    <div class="nws-modal-spread" id="nwsModalSpread">
      <!-- Left page: Visual + meta -->
      <div class="nws-modal-page nws-modal-page--left" id="nwsModalLeft"></div>
      <!-- Spine / gutter -->
      <div class="nws-modal-spine"></div>
      <!-- Right page: Full content -->
      <div class="nws-modal-page nws-modal-page--right" id="nwsModalRight"></div>
      <!-- Close stamp -->
      <button class="nws-modal-close" id="nwsModalClose" aria-label="إغلاق">
        <span>✕</span>
      </button>
    </div>
  </div>

  <script type="module">
    import { renderHeader, renderFooter } from './js/main.js?v=3.4';
    import { getPosts } from './js/posts.js?v=3.4';
    import { getSections } from './js/sections.js?v=3.4';

    /* ── Helpers ───────────────────────────────────────── */
    const MONTHS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const toAr = s => String(s);
    const fmtDate = d => { if (!d) return ''; const dt = new Date(d); return `${toAr(dt.getDate())} ${MONTHS[dt.getMonth()]} ${toAr(dt.getFullYear())}`; };
    const FALLBACK = 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800&q=80';
    let ALL_POSTS = [];

    /* ── Article card renderer ──────────────────────────── */
    function artImg(p, h = 140) {
      const src = p.featured_image_url || FALLBACK;
      return `<div class="na-img-wrap">
        <img src="${src}" alt="${p.title}" style="height:${h}px" loading="lazy" class="na-img">
        <span class="na-img-cap">${p.sections?.name_ar || ''} · ${fmtDate(p.published_at || p.created_at)}</span>
      </div>`;
    }
    function artText(p, len = 170) {
      const excerpt = (p.excerpt || '').substring(0, len);
      return `<div class="na-text">
        <h3 class="na-title">
          <button class="na-title-btn na-open-modal" data-post-id="${p.id}">${p.title}</button>
        </h3>
        <p class="na-excerpt">${excerpt}…</p>
        <div class="na-foot">
          <button class="na-more na-open-modal" data-post-id="${p.id}">إقرأ المزيد →</button>
          <span class="na-author">${p.author_name || 'المحرر'}</span>
        </div>
      </div>`;
    }

    /* pos: 'right' | 'left' | 'top' */
    function renderArticle(p, pos = 'right', imgH = 140, textLen = 170) {
      if (pos === 'top') {
        return `<article class="na na--top">
          ${artImg(p, imgH)}
          ${artText(p, textLen)}
        </article>`;
      }
      if (pos === 'right') {
        return `<article class="na na--row">
          ${artImg(p, imgH)}
          ${artText(p, textLen)}
        </article>`;
      }
      // left
      return `<article class="na na--row-rev">
        ${artText(p, textLen)}
        ${artImg(p, imgH)}
      </article>`;
    }

    /* ═══ REAL VINTAGE NEWSPAPER LAYOUT ════════════════════
       Top: huge main headline, large featured image, 2 cols text
       Middle: 2 columns — right (green header + 2 cols text) · left (red title + small image/text)
       Bottom: 2 columns — left (blue header + text) · right (small image/text)
    */
    function tplNewspaper(posts, section) {
      const [p0, p1, p2, p3, p4] = posts;

      const getWesternDates = () => {
        const DAYS_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const MONTHS_WESTERN = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
        const d = new Date();
        const dayName = DAYS_AR[d.getDay()];
        const gregDay = d.getDate();
        const gregMonth = MONTHS_WESTERN[d.getMonth()];
        const gregYear = d.getFullYear();
        const gregStr = `${dayName}، ${gregDay} ${gregMonth} ${gregYear}`;
        
        let hijriStr = '';
        try {
          const parts = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {
            day: 'numeric', month: 'long', year: 'numeric'
          }).formatToParts(d);
          let result = '';
          parts.forEach(p => { if (p.type !== 'literal' || p.value !== ',') result += p.value; });
          const easternToWestern = {
            '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4',
            '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9'
          };
          hijriStr = result.trim().replace(/[٠-٩]/g, match => easternToWestern[match]);
        } catch (e) {
          hijriStr = '8 صفر 1448';
        }
        return `${gregStr}<br>${hijriStr} هـ هـ<br>العدد الأول •`;
      };

      // Helper to strip HTML tags for preview/excerpts
      const stripHtml = html => (html || '').replace(/<[^>]+>/g, '').trim();

      const getExcerpt = (post, minLen, maxLen) => {
        if (!post) return '';
        const clean = stripHtml(post.content || post.excerpt || '');
        if (clean.length <= minLen) return clean;
        const targetLen = Math.floor((minLen + maxLen) / 2);
        return clean.substring(0, targetLen) + '...';
      };

      const excerpt0 = getExcerpt(p0, 1800, 2200);
      const excerpt1 = getExcerpt(p1, 350, 420);
      const excerpt2 = getExcerpt(p2, 600, 700);
      const excerpt3 = getExcerpt(p3, 400, 450);
      
      const totalExcerpt4 = getExcerpt(p4, 550, 650);
      const part1 = totalExcerpt4.substring(0, 300);
      const part2 = totalExcerpt4.substring(300);

      const accentColor = section.color || '#2B2B2B';

      return `<div class="nws-slide" data-section-id="${section.id}">
        <div class="nws-page tpl-real-newspaper">
          
          <!-- Page Header (Masthead) -->
          <header class="w-full text-center mb-6">
            <!-- Title and Side Metadata Boxes in a single row -->
            <div class="flex-row-md py-4 border-b-double">
              
              <!-- Right Metadata Box -->
              <div class="masthead-col masthead-col-right headline-font text-right" style="font-size: 0.85rem; line-height: 1.4; display: flex; flex-direction: column; justify-content: center; color: #2B2B2B;">
                <span>مرحبا بك</span>
                <span>جريدة مستقلة للفكر الحر</span>
                <span>تأسست عام 2026 م</span>
              </div>
              
              <!-- Center Newspaper Title -->
              <div class="masthead-col text-center" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <a href="index.html" class="hover:text-red-900 transition-colors block" style="text-decoration: none; color: inherit;">
                  <img src="LOGO.png" alt="الصحيفة" style="height: 60px; margin: 0 auto; max-width: 100%; object-fit: contain; display: block;">
                </a>
              </div>
              
              <!-- Left Metadata Box -->
              <div class="masthead-col masthead-col-left headline-font text-left" style="font-size: 0.85rem; line-height: 1.4; display: flex; flex-direction: column; justify-content: center; color: #2B2B2B;">
                <span>${getWesternDates()}</span>
              </div>
              
            </div>
          </header>

          <!-- Content Grid (3 Columns) -->
          <div class="grid-3-col">
            
            <!-- COLUMN 1: RIGHT COLUMN (Article 1 - Main Feature) -->
            <section class="col-divider-left">
              <article>
                <div>
                  <div class="cairo-font red-800 mb-1" style="font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: ${accentColor}">${section.name_ar} اليوم</div>
                  <h2 class="headline-font mb-3" style="font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 0 0 0.75rem 0;">
                    <button class="na-title-btn na-open-modal text-right" data-post-id="${p0.id}">${p0.title}</button>
                  </h2>
                  <div class="text-xs opacity-75 mb-3 cairo-font">بقلم: ${p0.author_name || 'المحرر'}</div>
                  
                  <div class="text-sm text-justify" style="line-height: 1.6; margin-bottom: 1rem;">
                    <img src="${p0.featured_image_url || FALLBACK}" alt="${p0.title}" class="vintage-image" style="width: 160px; height: 160px; float: left; margin: 8px; object-fit: cover;">
                    <p>
                      ${excerpt0}
                      <button class="read-more-btn headline-font na-open-modal" style="display: inline-block; margin-right: 5px; padding: 2px 6px; font-size: 0.75rem;" data-post-id="${p0.id}">إقرأ المزيد</button>
                    </p>
                  </div>
                </div>
              </article>
            </section>

            <!-- COLUMN 2: MIDDLE COLUMN (Articles 2 & 3) -->
            <section class="col-divider-both" style="display: flex; flex-direction: column;">
              <!-- ARTICLE 2 (Top) -->
              <article class="border-b-thin pb-6 mb-6" style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                  <div class="cairo-font red-800 mb-1" style="font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: ${accentColor}">شؤون إعلامية</div>
                  <h2 class="headline-font mb-2" style="font-size: 1.25rem; font-weight: 700; line-height: 1.25; margin: 0 0 0.5rem 0;">
                    <button class="na-title-btn na-open-modal text-right" data-post-id="${p1.id}">${p1.title}</button>
                  </h2>
                  <div class="text-xs opacity-75 mb-3 cairo-font">بقلم: ${p1.author_name || 'المحرر'}</div>
                  
                  <div class="mb-3">
                    <img src="${p1.featured_image_url || FALLBACK}" alt="${p1.title}" class="aspect-16-9 vintage-image">
                    <span class="block text-center mt-1 opacity-70" style="display: block; font-size: 0.65rem; font-style: italic;">ورشة الصحافة في عصر الحداثة والتحول التمويلي</span>
                  </div>
                  
                  <p class="text-sm text-justify" style="line-height: 1.6;">
                    ${excerpt1}
                  </p>
                </div>
                <div class="mt-3 text-left">
                  <button class="read-more-btn headline-font na-open-modal" data-post-id="${p1.id}">إقرأ المزيد</button>
                </div>
              </article>

              <!-- ARTICLE 3 (Bottom) -->
              <article style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; margin-top: 1.5rem;">
                <div>
                  <div class="cairo-font red-800 mb-1" style="font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: ${accentColor}">تعليم ومستقبل</div>
                  <h2 class="headline-font mb-2" style="font-size: 1.25rem; font-weight: 700; line-height: 1.25; margin: 0 0 0.5rem 0;">
                    <button class="na-title-btn na-open-modal text-right" data-post-id="${p2.id}">${p2.title}</button>
                  </h2>
                  <div class="text-xs opacity-75 mb-3 cairo-font">بقلم: ${p2.author_name || 'المحرر'}</div>
                  
                  <div class="text-sm text-justify" style="line-height: 1.6;">
                    <img src="${p2.featured_image_url || FALLBACK}" alt="${p2.title}" class="vintage-image" style="width: 140px; height: 140px; float: right; margin: 8px; object-fit: cover;">
                    <p>${excerpt2}</p>
                  </div>
                </div>
                <div class="mt-4 pt-3 border-dashed-top text-left">
                  <button class="read-more-btn headline-font na-open-modal" data-post-id="${p2.id}">إقرأ المزيد</button>
                </div>
              </article>
            </section>

            <!-- COLUMN 3: LEFT COLUMN (Articles 4 & 5) -->
            <section class="col-divider-right" style="display: flex; flex-direction: column;">
              <!-- ARTICLE 4 (Top) -->
              <article class="border-b-thin pb-6 mb-6" style="flex: 1; display: flex; flex-direction: column; justify-content: space-between;">
                <div>
                  <div class="cairo-font red-800 mb-1" style="font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: ${accentColor}">ثقافات وحوار</div>
                  <h2 class="headline-font mb-2" style="font-size: 1.25rem; font-weight: 700; line-height: 1.25; margin: 0 0 0.5rem 0;">
                    <button class="na-title-btn na-open-modal text-right" data-post-id="${p3.id}">${p3.title}</button>
                  </h2>
                  <div class="text-xs opacity-75 mb-3 cairo-font">بقلم: ${p3.author_name || 'المحرر'}</div>
                  
                  <div class="text-sm text-justify" style="line-height: 1.6;">
                    <img src="${p3.featured_image_url || FALLBACK}" alt="${p3.title}" class="vintage-image" style="width: 110px; height: 147px; float: left; margin: 8px; object-fit: cover;">
                    <p>${excerpt3}</p>
                  </div>
                </div>
                <div class="mt-3 text-left">
                  <button class="read-more-btn headline-font na-open-modal" data-post-id="${p3.id}">إقرأ المزيد</button>
                </div>
              </article>

              <!-- ARTICLE 5 (Bottom) -->
              <article style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; margin-top: 1.5rem;">
                <div>
                  <div class="cairo-font red-800 mb-1" style="font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: ${accentColor}">فنون بصرية</div>
                  <h2 class="headline-font mb-2" style="font-size: 1.25rem; font-weight: 700; line-height: 1.25; margin: 0 0 0.5rem 0;">
                    <button class="na-title-btn na-open-modal text-right" data-post-id="${p4.id}">${p4.title}</button>
                  </h2>
                  <div class="text-xs opacity-75 mb-3 cairo-font">بقلم: ${p4.author_name || 'المحرر'}</div>
                  
                  <p class="text-sm text-justify mb-3" style="line-height: 1.6; margin-bottom: 0.75rem;">
                    ${part1}
                  </p>
                  
                  <div class="mb-3">
                    <img src="${p4.featured_image_url || FALLBACK}" alt="${p4.title}" class="aspect-21-9 vintage-image">
                    <span class="block text-center mt-1 opacity-70" style="display: block; font-size: 0.65rem; font-style: italic;">أفق المدينة القديمة وتجسيد الأصالة البصرية</span>
                  </div>
                  
                  <p class="text-sm text-justify" style="line-height: 1.6;">
                    ${part2}
                  </p>
                </div>
                <div class="mt-4 pt-3 border-dashed-top text-left">
                  <button class="read-more-btn headline-font na-open-modal" data-post-id="${p4.id}">إقرأ المزيد</button>
                </div>
              </article>
            </section>

          </div>
          
          <!-- Footer Line -->
          <footer class="mt-6 pt-4 border-t-double text-center text-xs opacity-75 headline-font">
            <p>© 2026 الصحيفة. جميع الحقوق محفوظة. صحيفة أسبوعية فكرية مستقلة.</p>
          </footer>

        </div>
      </div>`;
    }

    const TEMPLATES = [tplNewspaper];

    /* ── Section header band ───────────────────────────── */
    function sectionBand(section, slideIdx, total) {
      const color = section.color || '#2B2B2B';
      return `<div class="nws-band" style="border-color:${color}">
        <div class="nws-band-inner">
          <span class="nws-band-ornament">❦</span>
          <span class="nws-band-name" style="color:${color}">${section.name_ar}</span>
          <span class="nws-band-rule"></span>
          <a href="category.html?section=${section.slug}" class="nws-band-link" style="color:${color}">تصفح الأرشيف ←</a>
          <span class="nws-band-ornament">❦</span>
        </div>
      </div>`;
    }

    /* ── Slider state ──────────────────────────────────── */
    let current = 0;
    let total = 0;
    let slides = [];
    let isAnimating = false;
    let touchStartX = 0;

    function goTo(idx) {
      if (isAnimating) return;
      if (idx < 0 || idx >= total) return;
      isAnimating = true;
      current = idx;
      const track = document.getElementById('nwsTrack');
      
      // Reset scroll position of target slide to top
      const targetSlide = track.children[idx];
      if (targetSlide) targetSlide.scrollTop = 0;

      // RTL: slides go from RIGHT to LEFT, so positive index moves LEFT (negative %) in LTR
      // We use negative translateX in RTL-aware way: slide N is at offset N * 100% from right
      track.style.transform = `translateX(${idx * 100}%)`;
      updateUI();
      setTimeout(() => { isAnimating = false; }, 650);
    }

    function updateUI() {
      const badge = document.getElementById('nwsSectionBadge');
      const counter = document.getElementById('nwsCounter');
      if (slides[current]) {
        badge.textContent = slides[current].section.name_ar;
        badge.style.color = slides[current].section.color || 'var(--accent)';
        badge.style.borderColor = slides[current].section.color || 'var(--accent)';
      }
      counter.textContent = `${toAr(current + 1)} / ${toAr(total)}`;

      // Dots
      document.querySelectorAll('.nws-dot').forEach((dot, i) => {
        dot.classList.toggle('nws-dot--active', i === current);
      });

      // Arrows visibility
      document.getElementById('nwsPrev').style.opacity = current === 0 ? '0.3' : '1';
      document.getElementById('nwsNext').style.opacity = current === total - 1 ? '0.3' : '1';
    }

    /* ── Modal ──────────────────────────────────────────── */
    function openModal(postId) {
      const post = ALL_POSTS.find(p => p.id === postId);
      if (!post) return;
      const modal = document.getElementById('nwsModal');
      const left = document.getElementById('nwsModalLeft');
      const right = document.getElementById('nwsModalRight');
      const img = post.featured_image_url || FALLBACK;
      const section = post.sections?.name_ar || '';
      const date = fmtDate(post.published_at || post.created_at);

      left.innerHTML = `
        <div class="nws-ml-top">
          <div class="nws-ml-section">${section}</div>
          <div class="nws-ml-rule"></div>
        </div>
        <div class="nws-ml-img-wrap">
          <img src="${img}" alt="${post.title}" class="nws-ml-img">
        </div>
        <div class="nws-ml-meta">
          <div class="nws-ml-date">📅 ${date}</div>
          <div class="nws-ml-author">✒ ${post.author_name || 'المحرر'}</div>
        </div>
        <div class="nws-ml-ornament">— الصحيفة —</div>
        <a href="article.html?id=${post.id}" class="nws-ml-link">فتح المقال الكامل →</a>
      `;

      const bodyHtml = post.content || `<p>${post.excerpt || ''}</p>`;
      right.innerHTML = `
        <div class="nws-mr-section-header">${section}</div>
        <h2 class="nws-mr-title">${post.title}</h2>
        <div class="nws-mr-rule"></div>
        <div class="nws-mr-body">${bodyHtml}</div>
      `;

      modal.setAttribute('aria-hidden', 'false');
      modal.classList.add('open');
      document.body.style.overflow = '';
    }

    function closeModal() {
      const modal = document.getElementById('nwsModal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    /* ── Main init ──────────────────────────────────────── */
    (async () => {
      await renderHeader();
      renderFooter();

      const [allPosts, sections] = await Promise.all([
        getPosts({ status: 'published', limit: 80 }),
        getSections()
      ]);
      ALL_POSTS = allPosts;

      const track = document.getElementById('nwsTrack');
      const dotsEl = document.getElementById('nwsDots');
      let slideIndex = 0;

            for (const section of sections) {
        let posts = [];
        if (section.featured_posts && Array.isArray(section.featured_posts)) {
          const secPosts = allPosts.filter(p => p.section_id === section.id);
          posts = section.featured_posts
            .map(id => secPosts.find(p => p.id === id))
            .filter(p => !!p);
        }
        if (posts.length < 5) {
          const remaining = allPosts.filter(p => p.section_id === section.id && !posts.some(fp => fp.id === p.id));
          posts = [...posts, ...remaining].slice(0, 5);
        }
        
        // Pad with placeholder articles to ensure no blank spaces and exactly 5 articles containing images
        while (posts.length < 5) {
          posts.push({
            id: `placeholder-${section.id}-${posts.length}`,
            title: `خبر افتراضي - قسم ${section.name_ar}`,
            excerpt: "هذا الخبر هو خبر افتراضي لملء المساحة الفارغة في هذه الصفحة من الصحيفة، ولضمان تنسيق تصميم الجريدة بشكل كامل وجذاب.",
            content: "هذا النص هو نص افتراضي لملء مكان المقال لضمان عدم وجود مساحات فارغة في تصميم الصفحة الصحفية العريقة. يرجى كتابة ونشر مقالات حقيقية في هذا القسم لتظهر هنا بدلاً من هذا الخبر الافتراضى.",
            featured_image_url: FALLBACK,
            author_name: "محرر الصحيفة",
            published_at: new Date().toISOString()
          });
        }

        const tplFn = TEMPLATES[0];
        const band = sectionBand(section, slideIndex, sections.length);
        const slideContent = tplFn(posts, section);

        // Inject band inside the nws-page container of the slide
        const wrapper = document.createElement('div');
        wrapper.innerHTML = slideContent;
        const slideEl = wrapper.firstElementChild;
        const pageEl = slideEl.querySelector('.nws-page');
        if (pageEl) {
          pageEl.insertAdjacentHTML('afterbegin', band);
        } else {
          slideEl.insertAdjacentHTML('afterbegin', band);
        }
        track.appendChild(slideEl);

        // Dot
        const dot = document.createElement('button');
        dot.className = 'nws-dot';
        dot.setAttribute('aria-label', section.name_ar);
        dot.title = section.name_ar;
        dot.style.setProperty('--dot-color', section.color || 'var(--ink)');
        dot.addEventListener('click', () => goTo(slideIndex));
        dotsEl.appendChild(dot);

        slides.push({ section, posts });
        slideIndex++;
      }

      total = slides.length;

      if (total === 0) {
        track.innerHTML = '<div class="nws-slide" style="display:flex;align-items:center;justify-content:center;"><p style="font-size:1.5rem;font-family:var(--font-serif)">لا توجد أقسام منشورة بعد.</p></div>';
      }

      // Arrow events
      document.getElementById('nwsPrev').addEventListener('click', () => goTo(current - 1));
      document.getElementById('nwsNext').addEventListener('click', () => goTo(current + 1));

      // Keyboard navigation
      document.addEventListener('keydown', e => {
        if (document.getElementById('nwsModal').classList.contains('open')) {
          if (e.key === 'Escape') closeModal();
          return;
        }
        if (e.key === 'ArrowLeft') goTo(current + 1);
        if (e.key === 'ArrowRight') goTo(current - 1);
      });

      // Touch / swipe
      track.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
      track.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) goTo(dx > 0 ? current - 1 : current + 1);
      }, { passive: true });

      // Modal open
      document.addEventListener('click', e => {
        const btn = e.target.closest('.na-open-modal');
        if (btn) {
          e.preventDefault();
          openModal(btn.dataset.postId);
        }
      });

      // Modal close
      document.getElementById('nwsModalClose').addEventListener('click', closeModal);
      document.getElementById('nwsModalBackdrop').addEventListener('click', closeModal);

      // Hide loading
      const loading = document.getElementById('nwsLoading');
      loading.style.opacity = '0';
      setTimeout(() => { loading.style.display = 'none'; }, 500);

      // Init UI
      updateUI();

      // Clear cached posts so fresh seed applies
      const v = '3.4';
      if (localStorage.getItem('sa7ifa_slider_v') !== v) {
        localStorage.removeItem('sa7ifa_db_posts');
        localStorage.removeItem('sa7ifa_db_articles');
        localStorage.setItem('sa7ifa_slider_v', v);
        location.reload();
        return;
      }
    })();
  </script>
</body>

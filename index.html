<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الصحيفة — جريدة عربية مستقلة للفكر والتحليل">
  <title>الصحيفة — الرئيسية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css?v=3.4">
  <link rel="stylesheet" href="css/pages.css?v=3.4">
  <link rel="stylesheet" href="css/newspaper_slider.css?v=1.0">
  <style>
    /* ── Body override for slider mode ─────────────────── */
    body { overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    .site-header { flex-shrink: 0; }
    .nws-slider { flex: 1; min-height: 0; }
  </style>
</head>
<body>

  <!-- ═══ FULL-PAGE NEWSPAPER SLIDER ═════════════════════ -->
  <div class="nws-slider" id="nwsSlider">

    <!-- Loading screen -->
    <div class="nws-loading" id="nwsLoading">
      <div class="nws-loading-inner">
        <div class="nws-loading-logo">الصحيفة</div>
        <div class="nws-loading-rule"></div>
        <p class="nws-loading-text">جارٍ طباعة الصحيفة…</p>
        <div class="nws-loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- Slide Track -->
    <div class="nws-track" id="nwsTrack"></div>

    <!-- Navigation Arrows -->
    <button class="nws-arrow nws-arrow--prev" id="nwsPrev" aria-label="السابق">&#8250;</button>
    <button class="nws-arrow nws-arrow--next" id="nwsNext" aria-label="التالي">&#8249;</button>

    <!-- Section name badge -->
    <div class="nws-section-badge" id="nwsSectionBadge"></div>

    <!-- Dot navigation -->
    <nav class="nws-dots" id="nwsDots" aria-label="تصفح الأقسام"></nav>

    <!-- Counter -->
    <div class="nws-counter" id="nwsCounter"></div>
  </div>

  <!-- ═══ ARTICLE MODAL — Double-page Book Spread ════════ -->
  <div class="nws-modal" id="nwsModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="nws-modal-backdrop" id="nwsModalBackdrop"></div>
    <div class="nws-modal-spread" id="nwsModalSpread">
      <!-- Left page: Visual + meta -->
      <div class="nws-modal-page nws-modal-page--left" id="nwsModalLeft"></div>
      <!-- Spine / gutter -->
      <div class="nws-modal-spine"></div>
      <!-- Right page: Full content -->
      <div class="nws-modal-page nws-modal-page--right" id="nwsModalRight"></div>
      <!-- Close stamp -->
      <button class="nws-modal-close" id="nwsModalClose" aria-label="إغلاق">
        <span>✕</span>
      </button>
    </div>
  </div>

  <script type="module">
    import { renderHeader } from './js/main.js?v=3.4';
    import { getPosts } from './js/posts.js?v=3.4';
    import { getSections } from './js/sections.js?v=3.4';

    /* ── Helpers ───────────────────────────────────────── */
    const MONTHS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const toAr = s => String(s).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    const fmtDate = d => { if (!d) return ''; const dt = new Date(d); return `${toAr(dt.getDate())} ${MONTHS[dt.getMonth()]} ${toAr(dt.getFullYear())}`; };
    const FALLBACK = 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800&q=80';
    let ALL_POSTS = [];

    /* ── Article card renderer ──────────────────────────── */
    function artImg(p, h = 140) {
      const src = p.featured_image_url || FALLBACK;
      return `<div class="na-img-wrap">
        <img src="${src}" alt="${p.title}" style="height:${h}px" loading="lazy" class="na-img">
        <span class="na-img-cap">${p.sections?.name_ar || ''} · ${fmtDate(p.published_at || p.created_at)}</span>
      </div>`;
    }
    function artText(p, len = 170) {
      const excerpt = (p.excerpt || '').substring(0, len);
      return `<div class="na-text">
        <h3 class="na-title">
          <button class="na-title-btn na-open-modal" data-post-id="${p.id}">${p.title}</button>
        </h3>
        <p class="na-excerpt">${excerpt}…</p>
        <div class="na-foot">
          <button class="na-more na-open-modal" data-post-id="${p.id}">إقرأ المزيد →</button>
          <span class="na-author">${p.author_name || 'المحرر'}</span>
        </div>
      </div>`;
    }

    /* pos: 'right' | 'left' | 'top' */
    function renderArticle(p, pos = 'right', imgH = 140, textLen = 170) {
      if (pos === 'top') {
        return `<article class="na na--top">
          ${artImg(p, imgH)}
          ${artText(p, textLen)}
        </article>`;
      }
      if (pos === 'right') {
        return `<article class="na na--row">
          ${artImg(p, imgH)}
          ${artText(p, textLen)}
        </article>`;
      }
      // left
      return `<article class="na na--row-rev">
        ${artText(p, textLen)}
        ${artImg(p, imgH)}
      </article>`;
    }

    /* ═══ REAL VINTAGE NEWSPAPER LAYOUT ════════════════════
       Top: huge main headline, large featured image, 2 cols text
       Middle: 2 columns — right (green header + 2 cols text) · left (red title + small image/text)
       Bottom: 2 columns — left (blue header + text) · right (small image/text)
    */
    function tplNewspaper(posts, section) {
      const [p0, p1, p2, p3, p4] = posts;
      const todayDate = fmtDate(new Date());

      // Helper to strip HTML tags for preview/excerpts
      const stripHtml = html => (html || '').replace(/<[^>]+>/g, '').trim();

      const time0 = p0 ? Math.max(1, Math.ceil(stripHtml(p0.content).split(/\s+/).length / 200)) : 1;

      return `<div class="nws-slide" data-section-id="${section.id}">
        <div class="nws-page tpl-real-newspaper" style="--accent: ${section.color || '#8b1a1a'}">
          
          <!-- ── Newspaper Masthead ── -->
          <div class="news-masthead">
            <div class="news-masthead-top">
              <div class="masthead-side-col masthead-side-left">
                <div class="side-box-inner">
                  <div class="side-box-title">استراتيجية وطنية</div>
                  <p class="side-box-text">تأسيس رؤية موحدة لمستقبل الفكر والتحليل في العالم العربي</p>
                </div>
              </div>
              <div class="masthead-center">
                <h1 class="masthead-title">الصحيفة</h1>
                <p class="masthead-subtitle">جريدة يومية سياسية مستقلة</p>
              </div>
              <div class="masthead-side-col masthead-side-right">
                <div class="side-box-inner">
                  <div class="side-box-title">ملف الأسبوع</div>
                  <p class="side-box-text">تحديات الانتقال التكنولوجي ودور الصحافة الرقمية</p>
                </div>
              </div>
            </div>
            
            <div class="masthead-info-bar">
              <span>السبت ٢٧ جويلية ٢٠٢٦ م</span>
              <span class="info-item-sep">◈</span>
              <span class="info-center">ملحق ${section.name_ar}</span>
              <span class="info-item-sep">◈</span>
              <span>السنة الأولى - العدد ٢٤</span>
            </div>
          </div>

          <!-- ── Main Article (Article 1) ── -->
          ${p0 ? `
            <article class="news-main-article">
              <h2 class="main-headline">
                <button class="na-title-btn na-open-modal" data-post-id="${p0.id}">${p0.title}</button>
              </h2>
              <div class="main-byline">
                <span>بقلم: ${p0.author_name || 'المحرر'}</span>
                <span>◈</span>
                <span>زمن القراءة: ${toAr(time0)} دقيقة</span>
              </div>
              
              <div class="main-content-layout">
                <div class="main-img-wrap">
                  <img src="${p0.featured_image_url || FALLBACK}" alt="${p0.title}" class="main-img">
                  <span class="main-img-cap">${p0.title}</span>
                </div>
                
                <div class="main-text-cols">
                  <p class="main-excerpt">${p0.excerpt || stripHtml(p0.content).substring(0, 180)}…</p>
                  <div class="main-body-text">${p0.content || ''}</div>
                  <div style="margin-top: 1rem; text-align: left;">
                    <button class="na-more na-open-modal" data-post-id="${p0.id}">إقرأ المزيد ←</button>
                  </div>
                </div>
              </div>
            </article>
          ` : ''}

          <!-- Divider line -->
          <div class="news-row-divider"></div>

          <!-- ── Middle Row (Articles 2 & 3) ── -->
          <div class="news-mid-row">
            <!-- Middle Right Column (Article 2) -->
            <div class="news-mid-col news-mid-right">
              ${p1 ? `
                <div class="col-section-header green-header">${section.name_ar} اليوم</div>
                <h3 class="col-title">
                  <button class="na-title-btn na-open-modal" data-post-id="${p1.id}">${p1.title}</button>
                </h3>
                <div class="col-byline">بقلم: ${p1.author_name || 'المحرر'}</div>
                <div class="col-text-cols">
                  <p class="col-excerpt">${p1.excerpt || stripHtml(p1.content).substring(0, 120)}…</p>
                  <div class="col-body-text">${p1.content || ''}</div>
                </div>
                <div style="margin-top: 0.5rem; text-align: left;">
                  <button class="na-more na-open-modal" data-post-id="${p1.id}">إقرأ المزيد ←</button>
                </div>
              ` : ''}
            </div>

            <!-- Middle Left Column (Article 3) -->
            <div class="news-mid-col news-mid-left">
              ${p2 ? `
                <h3 class="col-title red-title">
                  <button class="na-title-btn na-open-modal" data-post-id="${p2.id}">${p2.title}</button>
                </h3>
                <div class="col-byline">بقلم: ${p2.author_name || 'المحرر'}</div>
                <div class="col-content-wrap">
                  <div class="col-img-wrap-small">
                    <img src="${p2.featured_image_url || FALLBACK}" alt="${p2.title}">
                  </div>
                  <div class="col-text-wrap-small">
                    <p class="col-excerpt">${p2.excerpt || stripHtml(p2.content).substring(0, 120)}…</p>
                    <div class="col-body-text">${p2.content || ''}</div>
                    <div style="margin-top: 0.5rem; text-align: left;">
                      <button class="na-more na-open-modal" data-post-id="${p2.id}">إقرأ المزيد ←</button>
                    </div>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>

          <!-- Divider line -->
          <div class="news-row-divider"></div>

          <!-- ── Bottom Row (Articles 4 & 5) ── -->
          <div class="news-bot-row">
            <!-- Bottom Left (Article 4) -->
            <div class="news-bot-col news-bot-left">
              ${p3 ? `
                <div class="col-section-header blue-header">شؤون وتطلعات</div>
                <h3 class="col-title">
                  <button class="na-title-btn na-open-modal" data-post-id="${p3.id}">${p3.title}</button>
                </h3>
                <div class="col-byline">بقلم: ${p3.author_name || 'المحرر'}</div>
                <div class="col-text-cols">
                  <p class="col-excerpt">${p3.excerpt || stripHtml(p3.content).substring(0, 120)}…</p>
                  <div class="col-body-text">${p3.content || ''}</div>
                </div>
                <div style="margin-top: 0.5rem; text-align: left;">
                  <button class="na-more na-open-modal" data-post-id="${p3.id}">إقرأ المزيد ←</button>
                </div>
              ` : ''}
            </div>

            <!-- Bottom Right (Article 5) -->
            <div class="news-bot-col news-bot-right">
              ${p4 ? `
                <h3 class="col-title">
                  <button class="na-title-btn na-open-modal" data-post-id="${p4.id}">${p4.title}</button>
                </h3>
                <div class="col-byline">بقلم: ${p4.author_name || 'المحرر'}</div>
                <div class="col-content-wrap">
                  <div class="col-img-wrap-small">
                    <img src="${p4.featured_image_url || FALLBACK}" alt="${p4.title}">
                  </div>
                  <div class="col-text-wrap-small">
                    <p class="col-excerpt">${p4.excerpt || stripHtml(p4.content).substring(0, 120)}…</p>
                    <div class="col-body-text">${p4.content || ''}</div>
                    <div style="margin-top: 0.5rem; text-align: left;">
                      <button class="na-more na-open-modal" data-post-id="${p4.id}">إقرأ المزيد ←</button>
                    </div>
                  </div>
                </div>
              ` : ''}
            </div>
          </div>

        </div>
      </div>`;
    }

    const TEMPLATES = [tplNewspaper];

    /* ── Section header band ───────────────────────────── */
    function sectionBand(section, slideIdx, total) {
      const color = section.color || '#2B2B2B';
      return `<div class="nws-band" style="border-color:${color}">
        <div class="nws-band-inner">
          <span class="nws-band-ornament">❦</span>
          <span class="nws-band-name" style="color:${color}">${section.name_ar}</span>
          <span class="nws-band-rule"></span>
          <a href="category.html?section=${section.slug}" class="nws-band-link" style="color:${color}">تصفح الأرشيف ←</a>
          <span class="nws-band-ornament">❦</span>
        </div>
      </div>`;
    }

    /* ── Slider state ──────────────────────────────────── */
    let current = 0;
    let total = 0;
    let slides = [];
    let isAnimating = false;
    let touchStartX = 0;

    function goTo(idx) {
      if (isAnimating) return;
      if (idx < 0 || idx >= total) return;
      isAnimating = true;
      current = idx;
      const track = document.getElementById('nwsTrack');
      // RTL: slides go from RIGHT to LEFT, so positive index moves LEFT (negative %) in LTR
      // We use negative translateX in RTL-aware way: slide N is at offset N * 100% from right
      track.style.transform = `translateX(${idx * 100}%)`;
      updateUI();
      setTimeout(() => { isAnimating = false; }, 650);
    }

    function updateUI() {
      const badge = document.getElementById('nwsSectionBadge');
      const counter = document.getElementById('nwsCounter');
      if (slides[current]) {
        badge.textContent = slides[current].section.name_ar;
        badge.style.color = slides[current].section.color || 'var(--accent)';
        badge.style.borderColor = slides[current].section.color || 'var(--accent)';
      }
      counter.textContent = `${toAr(current + 1)} / ${toAr(total)}`;

      // Dots
      document.querySelectorAll('.nws-dot').forEach((dot, i) => {
        dot.classList.toggle('nws-dot--active', i === current);
      });

      // Arrows visibility
      document.getElementById('nwsPrev').style.opacity = current === 0 ? '0.3' : '1';
      document.getElementById('nwsNext').style.opacity = current === total - 1 ? '0.3' : '1';
    }

    /* ── Modal ──────────────────────────────────────────── */
    function openModal(postId) {
      const post = ALL_POSTS.find(p => p.id === postId);
      if (!post) return;
      const modal = document.getElementById('nwsModal');
      const left = document.getElementById('nwsModalLeft');
      const right = document.getElementById('nwsModalRight');
      const img = post.featured_image_url || FALLBACK;
      const section = post.sections?.name_ar || '';
      const date = fmtDate(post.published_at || post.created_at);

      left.innerHTML = `
        <div class="nws-ml-top">
          <div class="nws-ml-section">${section}</div>
          <div class="nws-ml-rule"></div>
        </div>
        <div class="nws-ml-img-wrap">
          <img src="${img}" alt="${post.title}" class="nws-ml-img">
        </div>
        <div class="nws-ml-meta">
          <div class="nws-ml-date">📅 ${date}</div>
          <div class="nws-ml-author">✒ ${post.author_name || 'المحرر'}</div>
        </div>
        <div class="nws-ml-ornament">— الصحيفة —</div>
        <a href="article.html?id=${post.id}" class="nws-ml-link">فتح المقال الكامل →</a>
      `;

      const bodyHtml = post.content || `<p>${post.excerpt || ''}</p>`;
      right.innerHTML = `
        <div class="nws-mr-section-header">${section}</div>
        <h2 class="nws-mr-title">${post.title}</h2>
        <div class="nws-mr-rule"></div>
        <div class="nws-mr-body">${bodyHtml}</div>
      `;

      modal.setAttribute('aria-hidden', 'false');
      modal.classList.add('open');
      document.body.style.overflow = '';
    }

    function closeModal() {
      const modal = document.getElementById('nwsModal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = 'hidden';
    }

    /* ── Main init ──────────────────────────────────────── */
    (async () => {
      await renderHeader();

      const [allPosts, sections] = await Promise.all([
        getPosts({ status: 'published', limit: 80 }),
        getSections()
      ]);
      ALL_POSTS = allPosts;

      const track = document.getElementById('nwsTrack');
      const dotsEl = document.getElementById('nwsDots');
      let slideIndex = 0;

      for (const section of sections) {
        const posts = allPosts.filter(p => p.section_id === section.id).slice(0, 5);
        if (posts.length === 0) continue;

        const tplFn = TEMPLATES[0];
        const band = sectionBand(section, slideIndex, sections.length);
        const slideContent = tplFn(posts, section);

        // Inject band inside slide div
        const wrapper = document.createElement('div');
        wrapper.innerHTML = slideContent;
        const slideEl = wrapper.firstElementChild;
        slideEl.insertAdjacentHTML('afterbegin', band);
        track.appendChild(slideEl);

        // Dot
        const dot = document.createElement('button');
        dot.className = 'nws-dot';
        dot.setAttribute('aria-label', section.name_ar);
        dot.title = section.name_ar;
        dot.style.setProperty('--dot-color', section.color || 'var(--ink)');
        dot.addEventListener('click', () => goTo(slideIndex));
        dotsEl.appendChild(dot);

        slides.push({ section, posts });
        slideIndex++;
      }

      total = slides.length;

      if (total === 0) {
        track.innerHTML = '<div class="nws-slide" style="display:flex;align-items:center;justify-content:center;"><p style="font-size:1.5rem;font-family:var(--font-serif)">لا توجد أقسام منشورة بعد.</p></div>';
      }

      // Arrow events
      document.getElementById('nwsPrev').addEventListener('click', () => goTo(current - 1));
      document.getElementById('nwsNext').addEventListener('click', () => goTo(current + 1));

      // Keyboard navigation
      document.addEventListener('keydown', e => {
        if (document.getElementById('nwsModal').classList.contains('open')) {
          if (e.key === 'Escape') closeModal();
          return;
        }
        if (e.key === 'ArrowLeft') goTo(current + 1);
        if (e.key === 'ArrowRight') goTo(current - 1);
      });

      // Touch / swipe
      track.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
      track.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) goTo(dx > 0 ? current - 1 : current + 1);
      }, { passive: true });

      // Modal open
      document.addEventListener('click', e => {
        const btn = e.target.closest('.na-open-modal');
        if (btn) {
          e.preventDefault();
          openModal(btn.dataset.postId);
        }
      });

      // Modal close
      document.getElementById('nwsModalClose').addEventListener('click', closeModal);
      document.getElementById('nwsModalBackdrop').addEventListener('click', closeModal);

      // Hide loading
      const loading = document.getElementById('nwsLoading');
      loading.style.opacity = '0';
      setTimeout(() => { loading.style.display = 'none'; }, 500);

      // Init UI
      updateUI();

      // Clear cached posts so fresh seed applies
      const v = '3.4';
      if (localStorage.getItem('sa7ifa_slider_v') !== v) {
        localStorage.removeItem('sa7ifa_db_posts');
        localStorage.removeItem('sa7ifa_db_articles');
        localStorage.setItem('sa7ifa_slider_v', v);
        location.reload();
        return;
      }
    })();
  </script>
</body>
</html>

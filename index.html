<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الصحيفة — منصة عربية مستقلة لنشر المقالات التحليلية والفكرية في الاقتصاد والمجتمع والأخبار والأفكار">
  <title>الصحيفة — الرئيسية</title>
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="css/style.css?v=3.3">
  <link rel="stylesheet" href="css/pages.css?v=3.3">
</head>
<body>
  <!-- Header and Footer are injected by main.js -->

  <main class="main-content">
    <div class="container">

      <!-- Breaking Bar / Ticker -->
      <div class="breaking-bar" id="breakingBar">
        <div class="breaking-bar__label">عاجل</div>
        <div class="breaking-bar__track" id="tickerTrack"></div>
      </div>

      <!-- Vintage Asymmetrical Broadsheet Grid -->
      <div class="vintage-broadsheet-grid">
        <!-- Right Column: 22% Latest Articles -->
        <aside class="broadsheet-col broadsheet-col--breaking">
          <h3>آخر المقالات</h3>
          <div id="breakingList">
            <p class="text-center p-4">جارٍ التحميل...</p>
          </div>
        </aside>

        <!-- Middle Column: 56% Main Story -->
        <section class="broadsheet-col broadsheet-col--main">
          <div id="heroContainer">
            <p class="text-center p-4">جارٍ التحميل...</p>
          </div>
        </section>

        <!-- Left Column: 22% Editorial / Opinion -->
        <aside class="broadsheet-col broadsheet-col--editorial">
          <h3>رأي التحرير</h3>
          <div id="editorialList">
            <div class="broadsheet-news-item">
              <h4 style="font-family: var(--font-serif); font-size: 1.05rem; font-weight: bold; margin-bottom: 0.5rem; text-align: center; color: var(--accent);">ميثاق التحرير</h4>
              <p style="font-size: 0.8rem; line-height: 1.5; color: var(--ink-light); text-align: justify; margin-bottom: 0;">نلتزم في "الصحيفة" بتقديم الكلمة الصادقة والتحليل الموضوعي الرصين، مستقلين عن التوجهات السياسية الآنية، ومنتصرين دائماً للكلمة الصادقة والفكر المستنير.</p>
            </div>
            <div style="border-top: 1px dashed var(--ink-faint); margin: 0.75rem 0;"></div>
            <div id="opinionList">
              <p class="text-center p-4">جارٍ التحميل...</p>
            </div>
          </div>
        </aside>
      </div>

      <!-- Dynamic Section Blocks — Newspaper Page Layout -->
      <div id="sectionsContainer">
        <!-- Sections injected here -->
      </div>

    </div>
  </main>

  <script type="module">
    import { renderHeader, renderFooter, renderPostCard, toArabicNumerals, getViewCount } from './js/main.js?v=3.3';
    import { getPosts, readingTime } from './js/posts.js?v=3.3';
    import { getSections } from './js/sections.js?v=3.3';

    // ---- Arabic Gregorian months (Maghrebi) ----
    const MONTHS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const toAr = s => String(s).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    const fmtDate = d => {
      if (!d) return '';
      const dt = new Date(d);
      return `${toAr(dt.getDate())} ${MONTHS[dt.getMonth()]} ${toAr(dt.getFullYear())}`;
    };

    // ---- Render a section in authentic newspaper multi-column layout ----
    function renderNewspaperSection(section, posts) {
      if (!posts || posts.length === 0) return '';
      const [main, second, third] = posts;
      const color = section.color || 'var(--ink)';

      function articleImg(p, h = 160) {
        const src = p.featured_image_url || 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800&q=80';
        return `<a href="article.html?id=${p.id}" class="nps-img-link">
          <img src="${src}" alt="${p.title}" style="width:100%;height:${h}px;object-fit:cover;filter:grayscale(100%) contrast(138%) brightness(95%);border:1px solid var(--ink);display:block;">
          <span class="nps-img-caption">الأرشيف الصحفي • ${section.name_ar}</span>
        </a>`;
      }

      // Main article (left-spanning big column)
      const mainHTML = `
        <div class="nps-col nps-col--main">
          ${articleImg(main, 200)}
          <h3 class="nps-title nps-title--main">
            <a href="article.html?id=${main.id}">${main.title}</a>
          </h3>
          <p class="nps-excerpt">${main.excerpt || ''}</p>
          <div class="nps-meta">
            <span>${fmtDate(main.published_at || main.created_at)}</span>
            <span class="nps-sep">·</span>
            <span>${toAr(readingTime(main.content))} د قراءة</span>
            <span class="nps-sep">·</span>
            <span>◎ ${toAr(getViewCount(main.id))}</span>
          </div>
        </div>
      `;

      // Secondary articles
      const secondHTML = second ? `
        <div class="nps-col nps-col--secondary">
          ${articleImg(second, 130)}
          <h4 class="nps-title nps-title--secondary">
            <a href="article.html?id=${second.id}">${second.title}</a>
          </h4>
          <p class="nps-excerpt nps-excerpt--sm">${(second.excerpt || '').substring(0, 120)}…</p>
          <div class="nps-meta">${fmtDate(second.published_at || second.created_at)}</div>
        </div>
      ` : '';

      const thirdHTML = third ? `
        <div class="nps-col nps-col--tertiary">
          <h4 class="nps-title nps-title--secondary">
            <a href="article.html?id=${third.id}">${third.title}</a>
          </h4>
          <p class="nps-excerpt nps-excerpt--sm">${(third.excerpt || '').substring(0, 100)}…</p>
          <div class="nps-meta">${fmtDate(third.published_at || third.created_at)}</div>
          <div style="margin-top: 0.8rem; border-top: 1px dashed var(--ink-faint); padding-top: 0.8rem;">
            <a href="category.html?section=${section.slug}" class="nps-more-link">تصفح القسم →</a>
          </div>
        </div>
      ` : `
        <div class="nps-col nps-col--tertiary">
          <a href="category.html?section=${section.slug}" class="nps-more-link">تصفح القسم →</a>
        </div>
      `;

      return `
        <section class="newspaper-section">
          <!-- Section Header — Ink bar with section name -->
          <div class="nps-header" style="border-color: ${color}; background: ${color};">
            <span class="nps-header__ornament">❧</span>
            <h2 class="nps-header__title">${section.name_ar}</h2>
            <span class="nps-header__ornament">❧</span>
          </div>
          <!-- 3-column newspaper grid -->
          <div class="nps-grid">
            ${mainHTML}
            ${secondHTML}
            ${thirdHTML}
          </div>
        </section>
      `;
    }

    (async () => {
      await renderHeader();

      const [allPosts, sections] = await Promise.all([
        getPosts({ status: 'published', limit: 20 }),
        getSections()
      ]);

      // 1. Hero (featured)
      const heroContainer = document.getElementById('heroContainer');
      const featured = allPosts.find(p => p.is_featured) || allPosts[0];
      if (featured) {
        heroContainer.innerHTML = renderPostCard(featured, 'featured');
      } else {
        heroContainer.innerHTML = '<p class="text-center p-4">لا توجد مقالات منشورة بعد.</p>';
      }

      // 2. Latest articles column (right)
      const breakingList = document.getElementById('breakingList');
      const breakingPosts = allPosts.filter(p => p.id !== featured?.id).slice(0, 4);
      breakingList.innerHTML = breakingPosts.map(p => `
        <div class="broadsheet-news-item">
          <h4><a href="article.html?id=${p.id}">${p.title}</a></h4>
          <time>${fmtDate(p.published_at || p.created_at)}</time>
        </div>
      `).join('');

      // 3. Editorial opinion column (left)
      const opinionList = document.getElementById('opinionList');
      const opinionPosts = allPosts.filter(p => p.id !== featured?.id && !breakingPosts.some(bp => bp.id === p.id)).slice(0, 3);
      if (opinionPosts.length > 0) {
        opinionList.innerHTML = opinionPosts.map(p => `
          <div class="broadsheet-news-item">
            <span style="font-size: 0.75rem; color: var(--accent); font-weight: bold;">[${p.sections?.name_ar || 'عام'}]</span>
            <h4 style="margin-top: 0.25rem; font-weight: 500;"><a href="article.html?id=${p.id}">${p.title}</a></h4>
          </div>
        `).join('');
      } else {
        opinionList.innerHTML = '<p class="text-center p-4" style="font-size:0.8rem;color:var(--ink-light)">تابعونا في الأعداد القادمة...</p>';
      }

      // 4. Section blocks — newspaper page layout
      const sectionsContainer = document.getElementById('sectionsContainer');
      let sectionsHTML = '';
      for (const section of sections) {
        const sectionPosts = allPosts.filter(p => p.section_id === section.id).slice(0, 3);
        if (sectionPosts.length === 0) continue;
        sectionsHTML += renderNewspaperSection(section, sectionPosts);
      }
      sectionsContainer.innerHTML = sectionsHTML || '<p class="text-center p-4">لا توجد أقسام بعد.</p>';

      // 5. News Ticker
      const tickerTrack = document.getElementById('tickerTrack');
      tickerTrack.innerHTML = allPosts.slice(0, 8).map(p => `
        <span style="margin: 0 2rem;">◆ ${p.title}</span>
      `).join('');

      renderFooter();
    })();
  </script>
</body>
</html>

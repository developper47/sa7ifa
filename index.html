<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الصحيفة — جريدة عربية مستقلة للفكر والتحليل">
  <title>الصحيفة — الرئيسية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css?v=3.4">
  <link rel="stylesheet" href="css/pages.css?v=3.4">
  <link rel="stylesheet" href="css/newspaper_slider.css?v=1.0">
  <!-- Google Fonts for newspaper style -->
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cairo:wght@400;600;700;900&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;700&family=Scheherazade+New:wght@400;700&family=Lateef:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ── Body override for slider mode ─────────────────── */
    body { overflow-x: hidden; overflow-y: auto; min-height: 100vh; display: flex; flex-direction: column; }
    .site-header { flex-shrink: 0; }
    .nws-slider { height: 85vh; min-height: 600px; flex-shrink: 0; }
    
    /* ── Custom Newspaper Layout Overrides ── */
    .nws-page {
      font-family: 'Noto Naskh Arabic', serif;
      color: #2B2B2B;
      background-color: #F1ECE1 !important;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15) 0%, rgba(0,0,0,0.05) 100%),
        repeating-linear-gradient(
          0deg,
          rgba(165,145,115,0.04),
          rgba(165,145,115,0.04) 1px,
          transparent 1px,
          transparent 24px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(165,145,115,0.04),
          rgba(165,145,115,0.04) 1px,
          transparent 1px,
          transparent 24px
        ) !important;
      border: 2px dashed #8B7E74 !important;
      padding: 16px !important;
      max-width: 1100px !important;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12), inset 0 0 120px rgba(110,85,60,0.15) !important;
    }
    
    .headline-font {
      font-family: 'Amiri', serif;
    }
    
    .cairo-font {
      font-family: 'Cairo', sans-serif;
    }

    /* Traditional drop cap */
    .lettrine::first-letter {
      font-size: 3.5rem;
      float: right;
      line-height: 0.85;
      margin-left: 0.5rem;
      margin-top: 0.2rem;
      font-weight: 700;
      color: #2B2B2B;
      font-family: 'Amiri', serif;
    }

    /* High-contrast grayscale/sepia filter & 1px border */
    .vintage-image {
      filter: grayscale(100%) contrast(120%) !important;
      border: 1px solid #2B2B2B !important;
      padding: 2px;
      background-color: #F4F1EA;
      transition: filter 0.3s ease, transform 0.3s ease;
    }
    
    .vintage-image:hover {
      filter: grayscale(20%) contrast(110%) !important;
      transform: scale(1.02);
    }
    
    /* Boxed read more links */
    .read-more-btn {
      display: inline-block;
      border: 1px solid #2B2B2B;
      padding: 4px 8px;
      background-color: #F4F1EA;
      color: #2B2B2B;
      font-size: 0.8rem;
      font-weight: bold;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }
    
    .read-more-btn:hover {
      background-color: #2B2B2B;
      color: #F4F1EA;
      text-decoration: none;
    }
    
    .na-title-btn {
      transition: color 0.2s;
    }
    .na-title-btn:hover {
      color: #9b1a1a;
    }

    /* --- Grid & Layout System --- */
    .grid-3-col {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 768px) {
      .grid-3-col {
        grid-template-columns: 1fr 1fr 1fr;
      }
      .col-divider-left {
        border-left: 1px dashed #8B7E74;
        padding-left: 1.5rem;
      }
      .col-divider-right {
        padding-right: 1.5rem;
      }
      .col-divider-both {
        border-left: 1px dashed #8B7E74;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }
    
    .flex-row-md {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }
    @media (min-width: 768px) {
      .flex-row-md {
        flex-direction: row;
      }
    }
    
    .masthead-col {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 1rem;
    }
    @media (min-width: 768px) {
      .masthead-col {
        width: 33.333%;
        margin-bottom: 0;
      }
      .masthead-col-right {
        border-left: 1px solid rgba(43, 43, 43, 0.2);
        padding-left: 1rem;
        text-align: right;
      }
      .masthead-col-left {
        border-right: 1px solid rgba(43, 43, 43, 0.2);
        padding-right: 1rem;
        text-align: left;
      }
    }
    
    .text-center { text-align: center; }
    .text-justify { text-align: justify; }
    .text-right { text-align: right; }
    .text-left { text-align: left; }
    
    .w-full { width: 100%; }
    .h-full { height: 100%; }
    
    .mb-1 { margin-bottom: 0.25rem; }
    .mb-2 { margin-bottom: 0.5rem; }
    .mb-3 { margin-bottom: 0.75rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .mt-4 { margin-top: 1rem; }
    
    .pt-3 { padding-top: 0.75rem; }
    .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
    
    .border-b-double {
      border-bottom: 2px dashed #8B7E74;
    }
    
    .border-t-double {
      border-top: 2px dashed #8B7E74;
    }
    
    .border-dashed-top {
      border-top: 1px dashed rgba(43, 43, 43, 0.4);
    }
    
    .border-b-thin {
      border-bottom: 1px solid #2B2B2B;
    }
    
    .pb-6 { padding-bottom: 1.5rem; }
    
    .aspect-16-9 {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    
    .aspect-21-9 {
      width: 100%;
      aspect-ratio: 21/9;
      object-fit: cover;
    }
    
    .red-800 {
      color: #9b1a1a;
    }
  </style>
</head>
<body>

  <!-- ═══ FULL-PAGE NEWSPAPER SLIDER ═════════════════════ -->
  <div class="nws-slider epoch-2000" id="nwsSlider">

    <!-- Vintage Control Bar -->
    <div class="nws-ctrl-bar">
      <div style="display: flex; align-items: center; gap: 6px;">
        <i class="fa-solid fa-clock-rotate-left" style="color: #8B7E74;"></i>
        <span>حقبة:</span>
        <select id="epochSelector" style="background: #3B3B3B; color: #F4F1EA; border: 1px solid #8B7E74; border-radius: 3px; padding: 2px 6px; font-family: inherit; font-size: 0.75rem; cursor: pointer;">
          <option value="default">الافتراضي (حالي)</option>
          <option value="1950">الخمسينيات (1950)</option>
          <option value="1960">الستينيات (1960)</option>
          <option value="1970">السبعينيات (1970)</option>
          <option value="1980">الثمانينيات (1980)</option>
          <option value="1990">التسعينيات (1990)</option>
          <option value="2000" selected>الألفينات (2000)</option>
        </select>
      </div>
      <span style="color: #8B7E74;">|</span>
      <div style="display: flex; align-items: center; gap: 6px;">
        <i class="fa-solid fa-scroll" style="color: #8B7E74;"></i>
        <span>ورق:</span>
        <select id="textureSelector" style="background: #3B3B3B; color: #F4F1EA; border: 1px solid #8B7E74; border-radius: 3px; padding: 2px 6px; font-family: inherit; font-size: 0.75rem; cursor: pointer;">
          <option value="default">مطبوع الافتراضي</option>
          <option value="rough">خشن ذو ألياف</option>
          <option value="sepia">أصفر معتق</option>
          <option value="yellow">مصفر حاد</option>
          <option value="smooth">أملس مطقس</option>
        </select>
      </div>
      <span style="color: #8B7E74;">|</span>
      <button id="magnifierToggle" style="background: none; border: 1px solid #8B7E74; color: #F4F1EA; padding: 2px 8px; border-radius: 3px; font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 5px;" title="تفعيل العدسة المكبرة النحاسية"><i class="fa-solid fa-magnifying-glass"></i> مكبرة</button>
      <span style="color: #8B7E74;">|</span>
      <button id="printPageBtn" style="background: none; border: 1px solid #8B7E74; color: #F4F1EA; padding: 2px 8px; border-radius: 3px; font-family: inherit; font-size: 0.75rem; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 5px;" title="طباعة الصحيفة بصيغة PDF"><i class="fa-solid fa-print"></i> طباعة</button>
    </div>

    <!-- Loading screen -->
    <div class="nws-loading" id="nwsLoading">
      <div class="nws-loading-inner">
        <div class="nws-loading-logo">الصحيفة</div>
        <div class="nws-loading-rule"></div>
        <p class="nws-loading-text">جارٍ طباعة الصحيفة…</p>
        <div class="nws-loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- Slide Track -->
    <div class="nws-track" id="nwsTrack"></div>

    <!-- Magnifier Lens circular overlay -->
    <div class="magnifier-lens" id="magnifierLens"></div>

    <!-- Floating Magnifier Close Button -->
    <button id="floatingMagnifierClose" style="display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 10000; background: #c0392b; color: #fff; border: 2px solid #fff; padding: 10px 20px; border-radius: 30px; font-family: 'Cairo', sans-serif; font-size: 0.9rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.3); transition: all 0.2s;" title="إغلاق العدسة المكبرة">❌ إغلاق العدسة المكبرة</button>

    <!-- Navigation Arrows -->
    <button class="nws-arrow nws-arrow--prev" id="nwsPrev" aria-label="السابق">&#8250;</button>
    <button class="nws-arrow nws-arrow--next" id="nwsNext" aria-label="التالي">&#8249;</button>

    <!-- Section name badge -->
    <div class="nws-section-badge" id="nwsSectionBadge"></div>

    <!-- Dot navigation -->
    <nav class="nws-dots" id="nwsDots" aria-label="تصفح الأقسام"></nav>

    <!-- Counter -->
    <div class="nws-counter" id="nwsCounter"></div>
  </div>

  <!-- ═══ CLIPPING MODAL — Torn Paper Scrap ════════════ -->
  <div class="nws-modal" id="clippingModal" aria-hidden="true" role="dialog" aria-modal="true" style="z-index: 1001;">
    <div class="nws-modal-backdrop" id="clippingModalBackdrop"></div>
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1002; width: 90%; max-width: 600px;">
      <div class="torn-scrap" id="tornScrap">
        <div class="torn-scrap-title" id="scrapTitle">عنوان المقال الصحفي</div>
        <div class="torn-scrap-meta" id="scrapMeta">بقلم: الكاتب الصحفي | التاريخ</div>
        <div class="torn-scrap-body" id="scrapBody">محتوى القصاصة الصحفية...</div>
      </div>
      <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; font-family: 'Cairo', sans-serif;">
        <button id="shareX" class="btn btn-primary" style="background: #000; border-color: #000; color: #fff; display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 6px 16px; border-radius: 4px; font-size:0.85rem;">𝕏 مشاركة</button>
        <button id="shareTelegram" class="btn btn-primary" style="background: #0088cc; border-color: #0088cc; color: #fff; display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 6px 16px; border-radius: 4px; font-size:0.85rem;">تلغرام</button>
        <button id="shareFacebook" class="btn btn-primary" style="background: #3b5998; border-color: #3b5998; color: #fff; display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 6px 16px; border-radius: 4px; font-size:0.85rem;">فيسبوك</button>
        <button id="closeClippingBtn" class="btn btn-outline" style="background: #fff; border-color: #ccc; color: #333; cursor: pointer; padding: 6px 16px; border-radius: 4px; font-size:0.85rem;">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- ═══ ARTICLE MODAL — Double-page Book Spread ════════ -->
  <div class="nws-modal" id="nwsModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="nws-modal-backdrop" id="nwsModalBackdrop"></div>
    <div class="nws-modal-spread" id="nwsModalSpread">
      <!-- Left page: Visual + meta -->
      <div class="nws-modal-page nws-modal-page--left" id="nwsModalLeft"></div>
      <!-- Spine / gutter -->
      <div class="nws-modal-spine"></div>
      <!-- Right page: Full content -->
      <div class="nws-modal-page nws-modal-page--right" id="nwsModalRight"></div>
      <!-- Close stamp -->
      <button class="nws-modal-close" id="nwsModalClose" aria-label="إغلاق">
        <span>✕</span>
      </button>
    </div>
  </div>

  <script type="module">
    import { renderHeader, renderFooter } from './js/main.js?v=3.4';
    import { getPosts } from './js/posts.js?v=3.4';
    import { getSections } from './js/sections.js?v=3.4';

    /* ── Helpers ───────────────────────────────────────── */
    function getWesternDates() {
      const DAYS_AR = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      const MONTHS_WESTERN = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
      const d = new Date();
      const dayName = DAYS_AR[d.getDay()];
      const gregDay = d.getDate();
      const gregMonth = MONTHS_WESTERN[d.getMonth()];
      const gregYear = d.getFullYear();
      const gregStr = `${dayName}، ${gregDay} ${gregMonth} ${gregYear}`;
      
      let hijriStr = '';
      try {
        const parts = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {
          day: 'numeric', month: 'long', year: 'numeric'
        }).formatToParts(d);
        let result = '';
        parts.forEach(p => { if (p.type !== 'literal' || p.value !== ',') result += p.value; });
        const easternToWestern = {
          '٠': '0', '١': '1', '٢': '2', '٣': '3', '٤': '4',
          '٥': '5', '٦': '6', '٧': '7', '٨': '8', '٩': '9'
        };
        hijriStr = result.trim().replace(/[٠-٩]/g, match => easternToWestern[match]);
      } catch (e) {
        hijriStr = '8 صفر 1448';
      }
      let hijriClean = hijriStr.replace(/هـ/g, '').trim();
      return `${gregStr}<br>${hijriClean} هـ<br>العدد الأول •`;
    }

    const MONTHS = ['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const toAr = s => String(s);
    const fmtDate = d => { if (!d) return ''; const dt = new Date(d); return `${toAr(dt.getDate())} ${MONTHS[dt.getMonth()]} ${toAr(dt.getFullYear())}`; };
    const FALLBACK = 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=800&q=80';
    let ALL_POSTS = [];

    /* ── Article card renderer ──────────────────────────── */
    function artImg(p, h = 140) {
      const src = p.featured_image_url || FALLBACK;
      return `<div class="na-img-wrap">
        <img src="${src}" alt="${p.title}" style="height:${h}px" loading="lazy" class="na-img">
        <span class="na-img-cap">${p.sections?.name_ar || ''} · ${fmtDate(p.published_at || p.created_at)}</span>
      </div>`;
    }
    function artText(p, len = 170) {
      const excerpt = (p.excerpt || '').substring(0, len);
      return `<div class="na-text">
        <h3 class="na-title">
          <button class="na-title-btn na-open-modal" data-post-id="${p.id}">${p.title}</button>
        </h3>
        <p class="na-excerpt">${excerpt}…</p>
        <div class="na-foot">
          <button class="na-more na-open-modal" data-post-id="${p.id}">إقرأ المزيد →</button>
          <span class="na-author">${p.author_name || 'المحرر'}</span>
        </div>
      </div>`;
    }

    /* pos: 'right' | 'left' | 'top' */
    function renderArticle(p, pos = 'right', imgH = 140, textLen = 170) {
      if (pos === 'top') {
        return `<article class="na na--top">
          ${artImg(p, imgH)}
          ${artText(p, textLen)}
        </article>`;
      }
      if (pos === 'right') {
        return `<article class="na na--row">
          ${artImg(p, imgH)}
          ${artText(p, textLen)}
        </article>`;
      }
      // left
      return `<article class="na na--row-rev">
        ${artText(p, textLen)}
        ${artImg(p, imgH)}
      </article>`;
    }

    /* ═══ REAL VINTAGE NEWSPAPER LAYOUT ════════════════════
       Top: huge main headline, large featured image, 2 cols text
       Middle: 2 columns — right (green header + 2 cols text) · left (red title + small image/text)
       Bottom: 2 columns — left (blue header + text) · right (small image/text)
    */
    function tplNewspaper(posts, section) {
      const [p0, p1, p2, p3, p4] = posts;


      // Helper to strip HTML tags for preview/excerpts
      const stripHtml = html => (html || '').replace(/<[^>]+>/g, '').trim();

      const getExcerpt = (post, minLen, maxLen) => {
        if (!post) return '';
        const clean = stripHtml(post.content || post.excerpt || '');
        if (clean.length <= minLen) return clean;
        const targetLen = Math.floor((minLen + maxLen) / 2);
        return clean.substring(0, targetLen) + '...';
      };

      const excerpt0 = getExcerpt(p0, 1800, 2200);
      const excerpt1 = getExcerpt(p1, 600, 800);
      const excerpt2 = getExcerpt(p2, 800, 1000);
      const excerpt3 = getExcerpt(p3, 600, 800);
      
      const totalExcerpt4 = getExcerpt(p4, 1000, 1200);
      const part1 = totalExcerpt4.substring(0, 500);
      const part2 = totalExcerpt4.substring(500);

      const accentColor = section.color || '#2B2B2B';

      return `<div class="nws-slide" data-section-id="${section.id}">
        <div class="nws-page tpl-real-newspaper">
          
          <!-- Page Header (Masthead) -->
          <header class="w-full text-center mb-6">
            <!-- Title and Side Metadata Boxes in a single row -->
            <div class="flex-row-md py-4 border-b-double">
              
              <!-- Right Metadata Box -->
              <div class="masthead-col masthead-col-right headline-font text-right" style="font-size: 0.85rem; line-height: 1.4; display: flex; flex-direction: column; justify-content: center; color: #2B2B2B;">
                <span>مرحبا بك</span>
                <span>جريدة مستقلة للفكر المستنير</span>
                <span>تأسست عام 2026 م</span>
              </div>
              
              <!-- Center Newspaper Title -->
              <div class="masthead-col text-center" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <a href="index.html" class="hover:text-red-900 transition-colors block" style="text-decoration: none; color: inherit;">
                  <img src="LOGO.png" alt="الصحيفة" style="height: 60px; margin: 0 auto; max-width: 100%; object-fit: contain; display: block;">
                </a>
              </div>
              
              <!-- Left Metadata Box -->
              <div class="masthead-col masthead-col-left headline-font text-left" style="font-size: 0.85rem; line-height: 1.4; display: flex; flex-direction: column; justify-content: center; color: #2B2B2B;">
                <span>${getWesternDates()}</span>
              </div>
              
            </div>
          </header>

          <!-- Content Grid (3 Columns) -->
          <div class="grid-3-col">
            
            <!-- COLUMN 1: RIGHT COLUMN (Article 1 - Main Feature) -->
            <section class="col-divider-left">
              <article>
                <div>
                  <div class="cairo-font red-800 mb-1" style="font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: ${accentColor}">${section.name_ar} اليوم</div>
                  <h2 class="headline-font mb-3" style="font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin: 0 0 0.75rem 0;">
                    <button class="na-title-btn na-open-modal text-right" data-post-id="${p0.id}">${p0.title}</button>
                  </h2>
                  <div class="text-xs opacity-75 mb-3 cairo-font">بقلم: ${p0.author_name || 'المحرر'}</div>
                  <div class="nws-header-actions" style="display: flex; gap: 10px; margin-bottom: 12px;">
                    <button class="scissors-btn" data-post-id="${p0.id}" style="background: none; border: none; font-size: 0.75rem; cursor: pointer; color: #8B7E74; font-family:'Cairo',sans-serif; display: flex; align-items: center; gap: 5px; padding: 0;" title="قص المقال كقصاصة ورق ممزقة"><i class="fa-solid fa-scissors" style="font-size: 0.8rem;"></i> قصاصة</button>
                    <button class="radio-broadcast-btn" data-post-id="${p0.id}" style="background: none; border: none; font-size: 0.75rem; cursor: pointer; color: #8B7E74; font-family:'Cairo',sans-serif; display: flex; align-items: center; gap: 5px; padding: 0;" title="الاستماع للمقال بصوت المذياع"><i class="fa-solid fa-radio" style="font-size: 0.8rem;"></i> راديو</button>

    /* ── Section header band ───────────────────────────── */
    function sectionBand(section, slideIdx, total) {
      const color = section.color || '#2B2B2B';
      const archiveLink = section.slug === 'home' 
        ? '' 
        : `<a href="category.html?section=${section.slug}" class="nws-band-link" style="color:${color}">تصفح الأرشيف ←</a>`;
      return `<div class="nws-band" style="border-color:${color}">
        <div class="nws-band-inner">
          <span class="nws-band-ornament">❦</span>
          <span class="nws-band-name" style="color:${color}">${section.name_ar}</span>
          <span class="nws-band-rule"></span>
          ${archiveLink}
          <span class="nws-band-ornament">❦</span>
        </div>
      </div>`;
    }

    /* ── Slider state ──────────────────────────────────── */
    let current = 0;
    let total = 0;
    let slides = [];
    let isAnimating = false;
    let touchStartX = 0;

    function goTo(idx) {
      if (isAnimating) return;
      if (idx < 0 || idx >= total) return;
      isAnimating = true;
      
      const track = document.getElementById('nwsTrack');
      const prevIdx = current;
      current = idx;
      
      const currentSlide = track.children[prevIdx];
      const nextSlide = track.children[idx];
      
      // Clear magnifier lens content
      const lens = document.getElementById('magnifierLens');
      lens.innerHTML = '';
      
      if (currentSlide && nextSlide) {
        // Overlay current slide on top of next slide
        currentSlide.style.position = 'absolute';
        currentSlide.style.zIndex = '100';
        currentSlide.style.left = '0';
        currentSlide.style.top = '0';
        currentSlide.style.width = '100%';
        currentSlide.style.height = '100%';
        
        // Translate the track instantly underneath currentSlide
        track.style.transition = 'none';
        track.style.transform = `translateX(${idx * 100}%)`;
        
        // Trigger page curl/flip on the inner .nws-page container
        const page = currentSlide.querySelector('.nws-page');
        if (page) {
          page.classList.add((idx > prevIdx) ? 'page-flip-left' : 'page-flip-right');
        }
        
        setTimeout(() => {
          if (page) {
            page.classList.remove('page-flip-left', 'page-flip-right');
          }
          currentSlide.removeAttribute('style');
          track.style.transition = '';
          
          nextSlide.scrollTop = 0;
          updateUI();
          isAnimating = false;
        }, 750);
      } else {
        track.style.transform = `translateX(${idx * 100}%)`;
        updateUI();
        isAnimating = false;
      }
    }

    function updateUI() {
      const badge = document.getElementById('nwsSectionBadge');
      const counter = document.getElementById('nwsCounter');
      if (slides[current]) {
        badge.textContent = slides[current].section.name_ar;
        badge.style.color = slides[current].section.color || 'var(--accent)';
        badge.style.borderColor = slides[current].section.color || 'var(--accent)';
      }
      counter.textContent = `${toAr(current + 1)} / ${toAr(total)}`;

      // Dots
      document.querySelectorAll('.nws-dot').forEach((dot, i) => {
        dot.classList.toggle('nws-dot--active', i === current);
      });

      // Arrows visibility
      document.getElementById('nwsPrev').style.opacity = current === 0 ? '0.3' : '1';
      document.getElementById('nwsNext').style.opacity = current === total - 1 ? '0.3' : '1';
    }

      function generateSummary(content) {
        if (!content) return "";
        // Clean HTML tags and replace with space to avoid word joining, then normalize spacing
        const clean = content.replace(/<\/?[^>]+(>|$)/g, " ").replace(/\s+/g, " ").trim();
        // Split by sentences (Arabic punctuation: . or ؟ or !)
        const sentences = clean.split(/[.؟!]+/).map(s => s.trim()).filter(s => s.length > 15);
        if (sentences.length === 0) {
          return clean.substring(0, 180) + '...';
        }
        // Always return a subset of sentences to guarantee it's a summary rather than the full text
        const limit = sentences.length > 2 ? Math.min(2, sentences.length - 1) : 1;
        return sentences.slice(0, limit).join('. ') + '.';

      // --- Vintage AM Radio SpeechSynthesis ---
      let noiseNode = null;
      let audioCtx = null;
      let isSpeaking = false;

      function playRadioStatic() {
        try {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtxClass) return;
          if (audioCtx) return;
          audioCtx = new AudioCtxClass();
          
          const bufferSize = 2 * audioCtx.sampleRate;
          const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          
          noiseNode = audioCtx.createBufferSource();
          noiseNode.buffer = noiseBuffer;
          noiseNode.loop = true;
          
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1000;
          filter.Q.value = 1.2;
          
          const gainNode = audioCtx.createGain();
          gainNode.gain.value = 0.04;
          
          noiseNode.connect(filter);
          filter.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          noiseNode.start();
        } catch(e) {
          console.error('Web Audio not supported or blocked:', e);
        }
      }

      function stopRadioStatic() {
        if (noiseNode) {
          try { noiseNode.stop(); } catch(e){}
          noiseNode = null;
        }
        if (audioCtx) {
          try { audioCtx.close(); } catch(e){}
          audioCtx = null;
        }
      }

      let cachedVoices = [];
      let currentTTSPlayer = null;
      function loadVoices() {
        if (typeof window !== 'undefined' && window.speechSynthesis) {
          cachedVoices = window.speechSynthesis.getVoices();
        }
      }
      if (typeof window !== 'undefined' && window.speechSynthesis) {
        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
          window.speechSynthesis.onvoiceschanged = loadVoices;
        }
      }

      function getArabicVoice() {
        const voices = cachedVoices.length > 0 ? cachedVoices : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
        return voices.find(v => v.lang === 'ar-SA') ||
               voices.find(v => v.lang === 'ar-EG') ||
               voices.find(v => v.lang.startsWith('ar') || v.lang.includes('ar')) ||
               null;
      }

      function playArabicTextTTS(text, onStart, onEnd, onError) {
        const maxChunkLen = 180;
        const rawChunks = [];
        
        // Split text by Arabic and general punctuation to get natural pauses
        const parts = text.split(/([،؛.؟\n]+)/);
        
        let currentChunk = "";
        for (let i = 0; i < parts.length; i++) {
          const part = parts[i];
          if (!part) continue;
          if (currentChunk.length + part.length > maxChunkLen) {
            if (currentChunk.trim()) {
              rawChunks.push(currentChunk.trim());
            }
            currentChunk = part;
          } else {
            currentChunk += part;
          }
        }
        if (currentChunk.trim()) {
          rawChunks.push(currentChunk.trim());
        }

        const chunks = [];
        for (let chunk of rawChunks) {
          while (chunk.length > maxChunkLen) {
            let splitIdx = chunk.lastIndexOf(' ', maxChunkLen);
            if (splitIdx === -1 || splitIdx === 0) splitIdx = maxChunkLen;
            chunks.push(chunk.substring(0, splitIdx).trim());
            chunk = chunk.substring(splitIdx).trim();
          }
          if (chunk.trim()) {
            chunks.push(chunk.trim());
          }
        }

        if (chunks.length === 0) {
          onEnd();
          return null;
        }

        let chunkIndex = 0;
        let audio = null;
        let cancelled = false;

        function playNext() {
          if (cancelled) return;
          if (chunkIndex >= chunks.length) {
            onEnd();
            return;
          }

          const txt = chunks[chunkIndex];
          const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=ar&client=tw-ob&q=${encodeURIComponent(txt)}`;
          
          audio = new Audio(url);
          audio.onplay = () => {
            if (chunkIndex === 0 && onStart) {
              onStart();
            }
          };
          audio.onended = () => {
            chunkIndex++;
            playNext();
          };
          audio.onerror = (err) => {
            console.warn("Google TTS chunk failed, falling back to SpeechSynthesis", err);
            if (audio) {
              audio.pause();
              audio = null;
            }
            useSpeechSynthesisFallback();
          };

          audio.play().catch(err => {
            console.warn("Audio play blocked/failed, falling back to SpeechSynthesis", err);
            useSpeechSynthesisFallback();
          });
        }

        function useSpeechSynthesisFallback() {
          if (cancelled) return;
          const remainingText = chunks.slice(chunkIndex).join(" ");
          if (!remainingText.trim()) {
            onEnd();
            return;
          }

          try {
            const utterance = new SpeechSynthesisUtterance(remainingText);
            utterance.lang = 'ar';
            utterance.rate = 0.9;
            
            const arVoice = getArabicVoice();
            if (arVoice) {
              utterance.voice = arVoice;
              utterance.lang = arVoice.lang;
            }

            utterance.onstart = () => {
              if (chunkIndex === 0 && onStart) onStart();
            };
            utterance.onend = () => {
              onEnd();
            };
            utterance.onerror = (e) => {
              console.error("SpeechSynthesis error:", e);
              onError();
            };

            window.speechSynthesis.speak(utterance);
            
            playerInstance.cancel = () => {
              cancelled = true;
              window.speechSynthesis.cancel();
            };
          } catch(e) {
            console.error("Fallback SpeechSynthesis failed:", e);
            onError();
          }
        }

        playNext();

        const playerInstance = {
          cancel: () => {
            cancelled = true;
            if (audio) {
              try { audio.pause(); } catch(e){}
              audio = null;
            }
            if (window.speechSynthesis) {
              try { window.speechSynthesis.cancel(); } catch(e){}
            }
          }
        };
        return playerInstance;
      }

              isSpeaking = false;
              btn.innerHTML = '<i class="fa-solid fa-radio" style="font-size:0.8rem; margin-left: 3px;"></i> راديو';
              btn.style.color = '#8B7E74';
              currentTTSPlayer = null;
            },
            () => {
              stopRadioStatic();
              isSpeaking = false;
              btn.innerHTML = '<i class="fa-solid fa-radio" style="font-size:0.8rem; margin-left: 3px;"></i> راديو';
              btn.style.color = '#8B7E74';
              currentTTSPlayer = null;
            }
          );
        }
      });

      // --- Varieties Page Interactions ---
      window.checkRiddle = function() {
        const ans = document.getElementById('riddleAnswer').value.trim();
        const fb = document.getElementById('riddleFeedback');
        fb.style.display = 'block';
        if (ans === 'القلم' || ans.includes('قلم')) {
          fb.textContent = '✅ أحسنت! إجابتك صحيحة (القلم).';
          fb.style.color = '#27ae60';
        } else {
          fb.textContent = '❌ إجابة غير صحيحة، حاول مجدداً.';
          fb.style.color = '#c0392b';
        }
      };

      window.checkCrossword = function() {
        const inputs = document.querySelectorAll('.cw-cell');
        let correct = true;
        inputs.forEach(input => {
          const r = input.dataset.row;
          const c = input.dataset.col;
          const val = input.value.trim();
          if (r === '0' && c === '1' && val !== 'ح') correct = false;
          if (r === '0' && c === '2' && val !== 'ف') correct = false;
          if (r === '1' && c === '0' && val !== 'ح') correct = false;
          if (r === '1' && c === '2' && val !== 'ي') correct = false;
          if (r === '2' && c === '0' && val !== 'ي') correct = false;
          if (r === '2' && c === '1' && val !== 'ف') correct = false;
        });
        
        const fb = document.getElementById('cwFeedback');
        fb.style.display = 'block';
        if (correct) {
          fb.textContent = '✅ تهانينا! جميع الكلمات صحيحة.';
          fb.style.color = '#27ae60';
        } else {
          fb.textContent = '❌ توجد بعض المربعات غير الصحيحة.';
          fb.style.color = '#c0392b';
        }
      };

      // Hide loading
      const loading = document.getElementById('nwsLoading');
      loading.style.opacity = '0';
      setTimeout(() => { loading.style.display = 'none'; }, 500);

      // Init UI
      updateUI();

      // Clear cached posts so fresh seed applies
      const v = '3.5';
      if (localStorage.getItem('sa7ifa_slider_v') !== v) {
        localStorage.removeItem('sa7ifa_db_posts');
        localStorage.removeItem('sa7ifa_db_articles');
        localStorage.setItem('sa7ifa_slider_v', v);
        location.reload();
        return;
      }
    })();
  </script>
</body>
</html>

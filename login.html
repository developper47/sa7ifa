<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تسجيل الدخول — الصحيفة">
  <title>دخول الكتاب — الصحيفة</title>
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="css/style.css?v=2.0">
  <link rel="stylesheet" href="css/pages.css?v=2.0">
</head>
<body class="auth-page-bg">

  <main class="auth-card">
    <div class="auth-logo">
      <a href="index.html">
        <img src="LOGO.png" alt="الصحيفة" class="site-logo" style="height: 60px; margin: 0 auto 0.5rem; display: block; max-width: 100%; object-fit: contain;">
      </a>
      <p>بوابة الكتاب والمحررين</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="loginTab">تسجيل الدخول</button>
      <button class="auth-tab" id="signupTab">إنشاء حساب</button>
    </div>

    <div id="authMessage" class="auth-message"></div>

    <!-- Login Form -->
    <form class="auth-form active" id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginEmail">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label class="form-label" for="loginPassword" style="margin-bottom: 0;">كلمة المرور</label>
          <a href="#" id="forgotPasswordLink" style="font-size: 0.8rem; color: var(--accent); font-weight: 600;">نسيت كلمة المرور؟</a>
        </div>
        <input type="password" class="form-control" id="loginPassword" placeholder="********" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="loginBtn">دخول</button>
    </form>

    <!-- Signup Form -->
    <form class="auth-form" id="signupForm">
      <div class="form-group">
        <label class="form-label" for="signupName">الاسم الكامل</label>
        <input type="text" class="form-control" id="signupName" placeholder="أحمد محمد" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="signupEmail">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="signupEmail" placeholder="name@example.com" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="signupPassword">كلمة المرور</label>
        <input type="password" class="form-control" id="signupPassword" placeholder="********" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="signupBtn">إنشاء حساب جديد</button>
    </form>

    <!-- Forgot Password Form -->
    <form class="auth-form" id="forgotForm">
      <p style="font-size: 0.85rem; color: var(--ink-light); margin-bottom: 1.25rem; text-align: center; line-height: 1.5;">
        أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.
      </p>
      <div class="form-group">
        <label class="form-label" for="forgotEmail">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="forgotEmail" placeholder="name@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="forgotBtn">إرسال رابط الاستعادة</button>
      <div style="text-align: center; margin-top: 1.25rem;">
        <a href="#" id="backToLoginLink" style="font-size: 0.85rem; color: var(--ink-light); font-weight: 600;">العودة لتسجيل الدخول</a>
      </div>
    </form>

    <!-- Reset Password Form -->
    <form class="auth-form" id="resetPasswordForm">
      <p style="font-size: 0.85rem; color: var(--ink-light); margin-bottom: 1.25rem; text-align: center; line-height: 1.5;">
        اكتب كلمة المرور الجديدة الخاصة بحسابك أدناه.
      </p>
      <div class="form-group">
        <label class="form-label" for="newPassword">كلمة المرور الجديدة</label>
        <input type="password" class="form-control" id="newPassword" placeholder="********" required minlength="6">
      </div>
      <div class="form-group">
        <label class="form-label" for="confirmNewPassword">تأكيد كلمة المرور الجديدة</label>
        <input type="password" class="form-control" id="confirmNewPassword" placeholder="********" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%" id="resetPasswordBtn">تحديث كلمة المرور</button>
    </form>

    <div style="text-align:center; margin-top: 1.5rem;">
      <a href="index.html" style="color: var(--ink-light); font-size: 0.82rem;">العودة إلى الصفحة الرئيسية</a>
    </div>
  </main>

  <script type="module">
    import { signIn, signUp, getCurrentUser, sendPasswordResetEmail, updatePassword } from './js/auth.js?v=3.1';

    (async () => {
      const loginTab = document.getElementById('loginTab');
      const signupTab = document.getElementById('signupTab');
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const forgotForm = document.getElementById('forgotForm');
      const resetPasswordForm = document.getElementById('resetPasswordForm');
      const message = document.getElementById('authMessage');

      const loginBtn = document.getElementById('loginBtn');
      const signupBtn = document.getElementById('signupBtn');
      const forgotBtn = document.getElementById('forgotBtn');
      const resetPasswordBtn = document.getElementById('resetPasswordBtn');

      const forgotPasswordLink = document.getElementById('forgotPasswordLink');
      const backToLoginLink = document.getElementById('backToLoginLink');
      const authTabs = document.querySelector('.auth-tabs');

      const showMsg = (txt, type) => {
        message.textContent = txt;
        message.className = `auth-message ${type}`;
      };

      const showForgotView = () => {
        loginForm.classList.remove('active');
        signupForm.classList.remove('active');
        resetPasswordForm.classList.remove('active');
        forgotForm.classList.add('active');
        authTabs.style.display = 'none';
        showMsg('', '');
      };

      const showLoginView = () => {
        forgotForm.classList.remove('active');
        signupForm.classList.remove('active');
        resetPasswordForm.classList.remove('active');
        loginForm.classList.add('active');
        authTabs.style.display = 'flex';
        loginTab.classList.add('active');
        signupTab.classList.remove('active');
        showMsg('', '');
      };

      const checkRecoveryState = () => {
        const hash = window.location.hash || '';
        if (hash.includes('type=recovery') || hash.includes('recovery')) {
          loginForm.classList.remove('active');
          signupForm.classList.remove('active');
          forgotForm.classList.remove('active');
          authTabs.style.display = 'none';
          resetPasswordForm.classList.add('active');

          const subLabel = document.querySelector('.auth-logo p');
          if (subLabel) subLabel.textContent = 'إعادة تعيين كلمة المرور';

          showMsg('يرجى كتابة كلمة المرور الجديدة وتأكيدها أدناه.', 'success');
          return true;
        }
        return false;
      };

      // On load, check if we are in recovery redirect
      const isRecovery = checkRecoveryState();
      if (!isRecovery) {
        const user = await getCurrentUser();
        if (user) window.location.href = 'dashboard.html';
      }

      // Tab logic
      loginTab.onclick = () => {
        loginTab.classList.add('active'); signupTab.classList.remove('active');
        loginForm.classList.add('active'); signupForm.classList.remove('active');
        forgotForm.classList.remove('active'); resetPasswordForm.classList.remove('active');
      };
      signupTab.onclick = () => {
        signupTab.classList.add('active'); loginTab.classList.remove('active');
        signupForm.classList.add('active'); loginForm.classList.remove('active');
        forgotForm.classList.remove('active'); resetPasswordForm.classList.remove('active');
      };

      if (window.location.hash === '#signup') signupTab.click();

      forgotPasswordLink.onclick = (e) => {
        e.preventDefault();
        showForgotView();
      };

      backToLoginLink.onclick = (e) => {
        e.preventDefault();
        showLoginView();
      };

      // Sign In
      loginForm.onsubmit = async (e) => {
        e.preventDefault();
        loginBtn.disabled = true;
        loginBtn.textContent = 'جارٍ التحقق...';
        
        const res = await signIn(
          document.getElementById('loginEmail').value,
          document.getElementById('loginPassword').value
        );

        if (res.success) {
          showMsg('تم تسجيل الدخول بنجاح! جارٍ التحويل...', 'success');
          setTimeout(() => window.location.href = 'dashboard.html', 800);
        } else {
          showMsg(res.message, 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = 'دخول';
        }
      };

      // Sign Up
      signupForm.onsubmit = async (e) => {
        e.preventDefault();
        signupBtn.disabled = true;
        signupBtn.textContent = 'جارٍ الإنشاء...';

        const res = await signUp(
          document.getElementById('signupName').value,
          document.getElementById('signupEmail').value,
          document.getElementById('signupPassword').value
        );

        if (res.success) {
          showMsg('تم إنشاء الحساب بنجاح! يرجى تسجيل الدخول.', 'success');
          signupForm.reset();
          loginTab.click();
        } else {
          showMsg(res.message, 'error');
        }
        signupBtn.disabled = false;
        signupBtn.textContent = 'إنشاء حساب جديد';
      };

      // Forgot Password (Request Reset Link)
      forgotForm.onsubmit = async (e) => {
        e.preventDefault();
        forgotBtn.disabled = true;
        forgotBtn.textContent = 'جاري الإرسال...';

        const email = document.getElementById('forgotEmail').value;
        const res = await sendPasswordResetEmail(email);

        if (res.success) {
          showMsg('تم إرسال رابط استعادة الحساب بنجاح إلى بريدك الإلكتروني!', 'success');
          forgotForm.reset();
        } else {
          showMsg(res.message, 'error');
        }
        forgotBtn.disabled = false;
        forgotBtn.textContent = 'إرسال رابط الاستعادة';
      };

      // Reset Password (Update Password)
      resetPasswordForm.onsubmit = async (e) => {
        e.preventDefault();

        const newPassword = document.getElementById('newPassword').value;
        const confirmNewPassword = document.getElementById('confirmNewPassword').value;

        if (newPassword !== confirmNewPassword) {
          showMsg('كلمتا المرور غير متطابقتين!', 'error');
          return;
        }

        resetPasswordBtn.disabled = true;
        resetPasswordBtn.textContent = 'جاري التحديث...';

        const res = await updatePassword(newPassword);

        if (res.success) {
          showMsg('تم تحديث كلمة المرور بنجاح! جاري تحويلك إلى لوحة التحكم...', 'success');
          setTimeout(() => {
            window.location.hash = ''; // Clear hash
            window.location.href = 'dashboard.html';
          }, 1500);
        } else {
          showMsg(res.message, 'error');
          resetPasswordBtn.disabled = false;
          resetPasswordBtn.textContent = 'تحديث كلمة المرور';
        }
      };
    })();
  </script>
</body>
</html>

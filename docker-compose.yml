version: '3.8'

services:
  # Database Service: PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: sa7ifa-postgres-db
    restart: always
    environment:
      POSTGRES_DB: sa7ifa_db
      POSTGRES_USER: sa7ifa_admin
      POSTGRES_PASSWORD: sa7ifa_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      # Persistent volume mapped outside the container (on the host system)
      # to ensure data is preserved across container updates/rebuilds
      - ./pgdata:/var/lib/postgresql/data

  # Web Service: Nginx to serve the Arabic newspaper frontend
  web:
    image: nginx:alpine
    container_name: sa7ifa-web-server
    restart: always
    ports:
      - "8080:80"
    volumes:
      # Map the workspace files to Nginx default public directory
      - .:/usr/share/nginx/html
    depends_on:
      - db

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — الصحيفة</title>
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3.2">
  <link rel="stylesheet" href="css/pages.css?v=3.2">
</head>
<body>

  <main class="main-content">
    <div class="container submit-container">
      <div id="authCheck"></div>

      <div id="editorArea" style="display:none;">
        <h1 class="mb-3">✏️ لوحة التحكم</h1>
        
        <div class="editor-card mb-4" id="writeSection">
          <h2 class="mb-2">إنشاء مقال جديد</h2>
          <form id="articleForm">
            <input type="hidden" id="artId">
            <div class="form-group">
              <label class="form-label" for="artTitle">عنوان المقال</label>
              <input type="text" class="form-control" id="artTitle" placeholder="أدخل عنواناً جذاباً..." required>
            </div>

            <div class="grid grid-cols-2">
              <div class="form-group">
                <label class="form-label" for="artCategory">القسم</label>
                <select class="form-control" id="artCategory" required>
                  <option value="economy">اقتصاد</option>
                  <option value="society">مجتمع</option>
                  <option value="news">أخبار</option>
                  <option value="ideas">فكر وأيديولوجيا</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="artTags">الوسوم (مفصولة بفاصلة)</label>
                <input type="text" class="form-control" id="artTags" placeholder="اقتصاد, تضخم, تحليل">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">صورة المقال</label>
              <div style="display:flex; gap:1.5rem; margin-bottom:0.6rem; font-size:0.9rem;">
                <label style="display:flex; align-items:center; gap:0.3rem; cursor:pointer;">
                  <input type="radio" name="imageSource" id="imgSourceLink" checked style="cursor:pointer;"> رابط خارجي
                </label>
                <label style="display:flex; align-items:center; gap:0.3rem; cursor:pointer;">
                  <input type="radio" name="imageSource" id="imgSourceUpload" style="cursor:pointer;"> تحميل ملف
                </label>
              </div>
              
              <div id="imgLinkContainer">
                <input type="url" class="form-control" id="artImage" placeholder="https://images.unsplash.com/photo-..." required>
              </div>
              <div id="imgUploadContainer" style="display:none;">
                <input type="file" class="form-control" id="artImageFile" accept="image/*">
              </div>

              <div id="imagePreview" style="margin-top:0.5rem; border:1px dashed #ddd; border-radius:8px; height:120px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#f8f9fa;">
                <span style="font-size:0.8rem;color:#999;">معاينة الصورة ستظهر هنا</span>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="artExcerpt">ملخص قصير (يظهر في البطاقة)</label>
              <textarea class="form-control" id="artExcerpt" style="min-height:80px;" placeholder="اكتب ملخصاً جذاباً للمقال..." required></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">محتوى المقال</label>
              
              <div class="rte-container">
                <div class="rte-toolbar">
                  <!-- Bold -->
                  <button type="button" class="rte-btn" data-command="bold" title="خط عريض" style="font-weight:bold;">B</button>
                  
                  <!-- Font Size -->
                  <select class="rte-select" data-command="fontSize" title="حجم الخط">
                    <option value="">حجم الخط</option>
                    <option value="3">عادي</option>
                    <option value="4">متوسط</option>
                    <option value="5">كبير</option>
                    <option value="6">كبير جداً</option>
                    <option value="7">ضخم</option>
                  </select>

                  <!-- Color -->
                  <div style="display:flex; align-items:center; gap:4px;">
                    <span style="font-size:0.8rem; color:#666;">اللون:</span>
                    <input type="color" class="rte-color" data-command="foreColor" value="#2b2b2b" title="لون الخط" style="width: 32px; height: 28px; padding:0; border:1px solid #ccc; border-radius:4px; cursor:pointer;">
                  </div>

                  <!-- Ordered List -->
                  <button type="button" class="rte-btn" data-command="insertOrderedList" title="قائمة مرقمة">1. قائمة مرقمة</button>

                  <!-- Headings -->
                  <select class="rte-select" data-command="heading" title="تنسيق العناوين">
                    <option value="">تنسيق العناوين</option>
                    <option value="H2">عنوان رئيسي (H2)</option>
                    <option value="H3">عنوان فرعي (H3)</option>
                    <option value="H4">عنوان جانبي (H4)</option>
                    <option value="P">فقرة عادية</option>
                  </select>

                  <!-- Heading Auto-Numbering -->
                  <button type="button" class="rte-btn" id="btnNumberHeadings" title="ترقيم العناوين تلقائياً">🔢 ترقيم العناوين</button>
                </div>
                
                <div class="rte-editor" id="artBodyEditor" contenteditable="true">
                  <p><br></p>
                </div>
              </div>
              <textarea id="artBody" style="display:none;"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">حفظ ونشر المراجعة</button>
            <button type="button" class="btn btn-outline" id="cancelEdit" style="display:none;">إلغاء التعديل</button>
          </form>
        </div>

        <!-- Dashboard Lists -->
        <div class="dashboard-tabs mt-4">
          <button class="auth-tab active" id="myArticlesTab">مقالاتي</button>
          <button class="auth-tab" id="adminTab" style="display:none;">🛡️ مراجعة المقالات</button>
        </div>

        <section class="my-articles-section mt-3">
          <div id="articleList">
            <p class="text-center p-4">جارٍ التحميل...</p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { renderHeader, renderFooter } from './js/main.js?v=3.5';
    import { getCurrentUser, isAdmin } from './js/auth.js?v=3.5';
    import { saveArticle, getArticles, moderateArticle, deleteArticle, getArticle, CATEGORIES } from './js/articles.js?v=3.5';

    renderHeader();

    // Inject RTE CSS styles
    if (!document.getElementById('rte-styles')) {
      const style = document.createElement('style');
      style.id = 'rte-styles';
      style.innerHTML = `
        .rte-container { border: 1.5px solid #eee; border-radius: 8px; overflow: hidden; background: #fff; margin-bottom: 1.5rem; }
        .rte-toolbar { background: #f8f9fa; border-bottom: 1.5px solid #eee; padding: 0.5rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .rte-btn { border: 1.5px solid #dfe6e9 !important; background: #ffffff !important; color: #2d3436 !important; border-radius: 6px !important; padding: 5px 10px !important; font-size: 0.9rem !important; cursor: pointer !important; transition: all 0.2s !important; display: inline-flex !important; align-items: center; gap: 4px; }
        .rte-btn:hover { background: #f1f2f6 !important; border-color: #b2bec3 !important; }
        .rte-select { border: 1.5px solid #dfe6e9 !important; background: #ffffff !important; color: #2d3436 !important; border-radius: 6px !important; padding: 5px !important; font-size: 0.9rem !important; cursor: pointer !important; }
        .rte-editor { min-height: 250px; max-height: 500px; overflow-y: auto; padding: 1.2rem; border: none; outline: none; background: #fff; font-family: 'Noto Naskh Arabic', serif !important; font-size: 1.1rem; line-height: 1.8; color: #2b2b2b; text-align: right; }
        .rte-editor h2, .rte-editor h3, .rte-editor h4 { font-family: 'Amiri', serif !important; color: #8b1a1a; margin-top: 1rem; margin-bottom: 0.5rem; }
        .rte-editor p { margin-bottom: 1rem; }
      `;
      document.head.appendChild(style);
    }

    const user = await getCurrentUser();
    const isAdminUser = isAdmin(user);
    const authCheck = document.getElementById('authCheck');
    const editorArea = document.getElementById('editorArea');
    const articleForm = document.getElementById('articleForm');
    const articleList = document.getElementById('articleList');
    const adminTab = document.getElementById('adminTab');
    const myArticlesTab = document.getElementById('myArticlesTab');
    const toast = document.getElementById('toast');
    const writeSection = document.getElementById('writeSection');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEdit = document.getElementById('cancelEdit');

    let currentView = 'user'; // 'user' or 'admin'

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Image selector handlers
    const imgLinkRadio = document.getElementById('imgSourceLink');
    const imgUploadRadio = document.getElementById('imgSourceUpload');
    const imgLinkContainer = document.getElementById('imgLinkContainer');
    const imgUploadContainer = document.getElementById('imgUploadContainer');
    const imgInput = document.getElementById('artImage');
    const imgFileInput = document.getElementById('artImageFile');
    const imgPreview = document.getElementById('imagePreview');

    if (imgLinkRadio) {
      imgLinkRadio.onchange = () => {
        imgLinkContainer.style.display = 'block';
        imgUploadContainer.style.display = 'none';
        imgInput.required = true;
      };
      imgUploadRadio.onchange = () => {
        imgLinkContainer.style.display = 'none';
        imgUploadContainer.style.display = 'block';
        imgInput.required = false;
      };

      imgInput.oninput = () => {
        const url = imgInput.value.trim();
        if (url) {
          imgPreview.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`;
        } else {
          imgPreview.innerHTML = '<span style="font-size:0.8rem;color:#999;">معاينة الصورة ستظهر هنا</span>';
        }
      };

      imgFileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const dataUrl = event.target.result;
            imgInput.value = dataUrl;
            imgPreview.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;">`;
          };
          reader.readAsDataURL(file);
        }
      };
    }

    // WYSIWYG command handlers
    const editor = document.getElementById('artBodyEditor');
    const toolbar = document.querySelector('.rte-toolbar');

    if (toolbar && editor) {
      toolbar.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-command]');
        if (!btn) return;
        const cmd = btn.dataset.command;
        
        e.preventDefault();
        if (cmd === 'bold' || cmd === 'insertOrderedList') {
          document.execCommand(cmd, false, null);
        }
        editor.focus();
      });

      const fontSelect = toolbar.querySelector('select[data-command="fontSize"]');
      fontSelect.onchange = () => {
        const val = fontSelect.value;
        if (val) {
          document.execCommand('fontSize', false, val);
        }
        fontSelect.value = '';
        editor.focus();
      };

      const colorInput = toolbar.querySelector('input[data-command="foreColor"]');
      colorInput.onchange = () => {
        const val = colorInput.value;
        if (val) {
          document.execCommand('foreColor', false, val);
        }
        editor.focus();
      };

      const headingSelect = toolbar.querySelector('select[data-command="heading"]');
      headingSelect.onchange = () => {
        const val = headingSelect.value;
        if (val) {
          if (val === 'P') {
            document.execCommand('formatBlock', false, '<p>');
          } else {
            document.execCommand('formatBlock', false, '<' + val + '>');
          }
        }
        headingSelect.value = '';
        editor.focus();
      };

      const numberHeadingsBtn = document.getElementById('btnNumberHeadings');
      numberHeadingsBtn.onclick = (e) => {
        e.preventDefault();
        
        const headings = editor.querySelectorAll('h2, h3, h4');
        let h2Count = 0;
        let h3Count = 0;
        let h4Count = 0;
        
        headings.forEach(heading => {
          let text = heading.innerHTML.replace(/^\d+(\.\d+)*\.?\s+/, '');
          const tag = heading.tagName.toLowerCase();
          
          if (tag === 'h2') {
            h2Count++;
            h3Count = 0;
            h4Count = 0;
            heading.innerHTML = `${h2Count}. ${text}`;
          } else if (tag === 'h3') {
            h3Count++;
            h4Count = 0;
            heading.innerHTML = `${h2Count}.${h3Count}. ${text}`;
          } else if (tag === 'h4') {
            h4Count++;
            heading.innerHTML = `${h2Count}.${h3Count}.${h4Count}. ${text}`;
          }
        });
        editor.focus();
      };
    }

    if (!user) {
      authCheck.innerHTML = `
        <div class="text-center" style="padding: 100px 0;">
          <h2>عذراً، يجب تسجيل الدخول للوصول لهذه الصفحة</h2>
          <p class="mb-3">يرجى تسجيل الدخول أو إنشاء حساب للبدء في كتابة مقالاتك.</p>
          <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
        </div>
      `;
    } else {
      editorArea.style.display = 'block';
      if (isAdminUser) {
        adminTab.style.display = 'block';
      }

      // Tab Switching
      myArticlesTab.addEventListener('click', () => {
        myArticlesTab.classList.add('active');
        adminTab.classList.remove('active');
        currentView = 'user';
        loadList();
      });

      adminTab.addEventListener('click', () => {
        adminTab.classList.add('active');
        myArticlesTab.classList.remove('active');
        currentView = 'admin';
        loadList();
      });

      // Handle Submit/Update
      articleForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'جارٍ الحفظ...';
        
        try {
          const tags = document.getElementById('artTags').value.split(',').map(t => t.trim()).filter(t => t);
          const id = document.getElementById('artId').value;
          
          const newArt = {
            title: document.getElementById('artTitle').value,
            category: document.getElementById('artCategory').value,
            tags: tags,
            image: imgInput.value,
            excerpt: document.getElementById('artExcerpt').value,
            body: editor.innerHTML,
            author_id: user.id,
            author_name: user.name,
            status: isAdminUser ? 'published' : 'pending' 
          };

          if (id) newArt.id = id;

          await saveArticle(newArt);
          showToast(id ? 'تم تحديث المقال بنجاح!' : 'تم تقديم المقال للمراجعة بنجاح!');
          resetForm();
          loadList();
        } catch (err) {
          showToast('خطأ: ' + err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'حفظ ونشر المراجعة';
        }
      });

      cancelEdit.addEventListener('click', resetForm);

      function resetForm() {
        articleForm.reset();
        document.getElementById('artId').value = '';
        submitBtn.textContent = 'حفظ ونشر المراجعة';
        cancelEdit.style.display = 'none';
        if (editor) editor.innerHTML = '<p><br></p>';
        if (imgPreview) imgPreview.innerHTML = '<span style="font-size:0.8rem;color:#999;">معاينة الصورة ستظهر هنا</span>';
        if (imgLinkRadio) {
          imgLinkRadio.checked = true;
          imgLinkContainer.style.display = 'block';
          imgUploadContainer.style.display = 'none';
          imgInput.required = true;
        }
        writeSection.scrollIntoView({ behavior: 'smooth' });
      }

      async function loadList() {
        articleList.innerHTML = '<p class="text-center p-4">جارٍ جلب البيانات الحقيقية...</p>';
        
        // Use async articles fetch
        const filter = currentView === 'admin' 
          ? { status: 'all' } 
          : { author_id: user.id, status: 'all' };
        
        const articles = await getArticles(filter);

        if (articles.length === 0) {
          articleList.innerHTML = '<p class="text-center p-4 color-muted">لا توجد مقالات لعرضها.</p>';
          return;
        }

        articleList.innerHTML = articles.map(art => {
          const statusText = art.status === 'published' ? 'منشور' : art.status === 'pending' ? 'بانتظار المراجعة' : 'مرفوض';
          const statusClass = `status-${art.status}`;
          const cat = CATEGORIES.find(c => c.id === art.category);

          return `
            <div class="article-list-item" data-id="${art.id}">
              <div>
                <strong style="display:block; margin-bottom: 4px;">${art.title}</strong>
                <span class="status-badge ${statusClass}">${statusText}</span>
                <small style="color: var(--text-muted); margin-right: 10px;">القسم: ${cat ? cat.name : art.category}</small>
                ${currentView === 'admin' ? `<br><small style="color: var(--accent);">الكاتب: ${art.author_name}</small>` : ''}
              </div>
              <div class="article-list-actions">
                ${currentView === 'admin' && art.status === 'pending' ? `
                  <button class="btn-approve" data-id="${art.id}" data-action="published">✅ اعتماد</button>
                  <button class="btn-delete" data-id="${art.id}" data-action="rejected">❌ رفض</button>
                ` : ''}
                <button class="btn-edit" data-id="${art.id}" data-action="edit">✏️ تعديل</button>
                <button class="btn-delete" data-id="${art.id}" data-action="delete">🗑️ حذف</button>
                <a href="article.html?id=${art.id}" class="btn-edit" style="text-decoration:none;">👁️ عرض</a>
              </div>
            </div>
          `;
        }).join('');

        // Action Handlers
        articleList.querySelectorAll('button[data-id]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const action = btn.dataset.action;

            try {
              if (action === 'delete') {
                if (confirm('هل أنت متأكد من حذف هذا المقال نهائياً من قاعدة البيانات؟')) {
                  await deleteArticle(id);
                  showToast('تم حذف المقال بنجاح.');
                  loadList();
                }
              } else if (action === 'published' || action === 'rejected') {
                await moderateArticle(id, action);
                showToast(action === 'published' ? 'تم اعتماد المقال ونشره.' : 'تم رفض المقال.');
                loadList();
              } else if (action === 'edit') {
                const art = await getArticle(id);
                if (art) {
                  document.getElementById('artId').value = art.id;
                  document.getElementById('artTitle').value = art.title;
                  document.getElementById('artCategory').value = art.category;
                  document.getElementById('artTags').value = (art.tags || []).join(', ');
                  imgInput.value = art.image || '';
                  document.getElementById('artExcerpt').value = art.excerpt || '';
                  if (editor) editor.innerHTML = art.body || '<p><br></p>';
                  
                  if (art.image && art.image.startsWith('data:image')) {
                    imgUploadRadio.checked = true;
                    imgLinkContainer.style.display = 'none';
                    imgUploadContainer.style.display = 'block';
                    imgInput.required = false;
                  } else {
                    imgLinkRadio.checked = true;
                    imgLinkContainer.style.display = 'block';
                    imgUploadContainer.style.display = 'none';
                    imgInput.required = true;
                  }
                  imgPreview.innerHTML = art.image ? `<img src="${art.image}" style="width:100%;height:100%;object-fit:cover;">` : '<span style="font-size:0.8rem;color:#999;">معاينة الصورة ستظهر هنا</span>';
                  
                  submitBtn.textContent = 'تحديث المقال';
                  cancelEdit.style.display = 'inline-block';
                  writeSection.scrollIntoView({ behavior: 'smooth' });
                }
              }
            } catch (err) {
              showToast('خطأ: ' + err.message);
            }
          });
        });
      }

      await loadList();
    }

    renderFooter();
  </script>
</body>
</html>

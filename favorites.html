<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="مقالاتك المفضلة — الصحيفة">
  <title>المفضلة — الصحيفة</title>
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="css/style.css?v=3.2">
  <link rel="stylesheet" href="css/pages.css?v=3.2">
</head>
<body>
  <!-- Header injected by main.js -->

  <main class="main-content">
    <div class="container">

      <div class="section-rule" style="margin-top: 2rem;">
        <h2 class="section-rule__label">♥ مقالاتي المفضلة</h2>
      </div>

      <div id="favoritesContainer">
        <p class="text-center p-4">جارٍ تحميل المفضلة...</p>
      </div>

    </div>
  </main>

  <script type="module">
    import { renderHeader, renderFooter, renderPostCard, toggleFavorite, getFavoritePosts, showToast } from './js/main.js?v=3.7';
    import { getPost } from './js/posts.js?v=3.7';
    import { getCurrentUser } from './js/auth.js?v=3.7';

    (async () => {
      await renderHeader();
      const user = await getCurrentUser();
      const container = document.getElementById('favoritesContainer');

      if (!user) {
        container.innerHTML = `
          <div class="text-center p-4" style="border: 1px solid var(--ink-faint); background: var(--paper-dark); padding: 3rem; margin: 2rem 0;">
            <p style="font-family: var(--font-serif); font-size: 1.3rem; margin-bottom: 1rem;">يجب تسجيل الدخول لعرض مفضلتك</p>
            <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
          </div>
        `;
        renderFooter();
        return;
      }

      const favIds = getFavoritePosts();
      if (favIds.length === 0) {
        container.innerHTML = `
          <div class="text-center p-4" style="border: 1px dashed var(--ink-faint); padding: 3rem; margin: 2rem 0;">
            <p style="font-family: var(--font-serif); font-size: 1.2rem; color: var(--ink-light); margin-bottom: 1rem;">لا توجد مقالات في مفضلتك بعد</p>
            <p style="font-size: 0.9rem; color: var(--ink-light);">عند قراءة مقال، انقر على زر ♡ لإضافته إلى مفضلتك</p>
            <a href="index.html" class="btn btn-outline" style="margin-top: 1rem;">تصفح المقالات</a>
          </div>
        `;
        renderFooter();
        return;
      }

      // Fetch all favorited posts
      const posts = await Promise.all(favIds.map(id => getPost(id).catch(() => null)));
      const validPosts = posts.filter(Boolean);

      if (validPosts.length === 0) {
        container.innerHTML = '<p class="text-center p-4">لم يتم العثور على المقالات المحفوظة.</p>';
        renderFooter();
        return;
      }

      container.innerHTML = `
        <div class="section-posts-newspaper">
          ${validPosts.map(p => renderPostCard(p)).join('')}
        </div>
        <div style="margin-top: 2rem; text-align: center;">
          <button id="clearFavBtn" class="btn btn-outline" style="font-size: 0.85rem; color: var(--ink-light);">
            ✕ مسح كل المفضلة
          </button>
        </div>
      `;

      document.getElementById('clearFavBtn').onclick = () => {
        if (confirm('هل تريد مسح كل المقالات المحفوظة من مفضلتك؟')) {
          localStorage.removeItem('sa7ifa_favorites');
          showToast('تم مسح المفضلة');
          container.innerHTML = '<p class="text-center p-4" style="color: var(--ink-light);">المفضلة فارغة الآن.</p>';
        }
      };

      renderFooter();
    })();
  </script>
</body>
</html>

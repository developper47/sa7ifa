<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — الصحيفة</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="css/style.css?v=3.2">
  <link rel="stylesheet" href="css/pages.css?v=3.2">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --dash-sidebar: #121212;
      --dash-accent: #8b1a1a;
      --dash-accent-soft: #fff5f5;
      --dash-bg: #f8f9fa;
      --dash-card: #ffffff;
      --dash-text: #2d3436;
      --dash-text-muted: #636e72;
      --dash-radius: 12px;
      --dash-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    body.dashboard-page {
      background-color: var(--dash-bg);
      font-family: 'Cairo', sans-serif;
      margin: 0;
      color: var(--dash-text);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--dash-sidebar);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
      position: fixed;
      height: 100vh;
      right: 0;
      top: 0;
      z-index: 100;
    }

    .sidebar-brand {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 1rem;
    }

    .nav-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
    .nav-item { margin-bottom: 0.5rem; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.2rem;
      color: #b2bec3;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.25s;
      font-weight: 500;
    }
    .nav-link:hover, .nav-link.active {
      background: var(--dash-accent);
      color: #fff;
    }
    .nav-label { font-size: 0.75rem; color: #636e72; text-transform: uppercase; margin: 1.5rem 1rem 0.5rem; }

    /* Main Content Area */
    .main-content-dash {
      margin-right: 280px;
      width: calc(100% - 280px);
      padding: 2rem 3rem;
      box-sizing: border-box;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid #e0e0e0;
    }

    #viewTitle { font-family: 'Amiri', serif; font-size: 2.4rem; margin: 0; color: var(--ink); }

    /* Content Cards */
    .card {
      background: var(--dash-card);
      border-radius: var(--dash-radius);
      box-shadow: var(--dash-shadow);
      padding: 2.5rem;
      border: 1px solid rgba(0,0,0,0.05);
    }

    /* Padding for Section Management title */
    .section-title-wrap {
       padding-bottom: 1.5rem;
       margin-bottom: 1.5rem;
       border-bottom: 1px solid #f0f0f0;
    }

    /* Lists */
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 10px;
      margin-bottom: 1rem;
      transition: transform 0.2s;
    }
    .list-item:hover { transform: scale(1.01); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

    .btn {
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.95rem;
    }
    .btn-primary { background: var(--dash-accent); color: #fff; }
    .btn-primary:hover { background: #6b1414; box-shadow: 0 4px 12px rgba(139, 26, 26, 0.3); }
    .btn-outline { background: #fff; border: 1.5px solid #dfe6e9; color: #2d3436; }
    .btn-outline:hover { background: #f8f9fa; border-color: #b2bec3; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; width: 100%; max-width: 500px;
      border-radius: 15px; padding: 2.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }

    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; margin-bottom: 0.6rem; font-weight: 700; font-size: 0.9rem; }
    .form-control {
      width: 100%; padding: 0.9rem; border: 1.5px solid #eee; border-radius: 8px;
      font-family: inherit; font-size: 1rem;
    }
    .form-control:focus { border-color: var(--dash-accent); outline: none; box-shadow: 0 0 0 3px rgba(139, 26, 26, 0.1); }

    /* Mobile */
    @media (max-width: 1024px) {
      .sidebar { width: 80px; padding: 1.5rem 0.5rem; align-items: center; }
      .sidebar-brand, .nav-link span, .nav-label { display: none; }
      .main-content-dash { margin-right: 80px; width: calc(100% - 80px); padding: 1.5rem; }
    }
  </style>
</head>
<body class="dashboard-page">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <a href="index.html" style="display: block;">
        <img src="LOGO.png" alt="الصحيفة" style="height: 45px; margin: 0 auto; filter: brightness(0) invert(1); max-width: 100%; object-fit: contain; display: block;">
      </a>
    </div>
    <ul class="nav-list">
      <div class="nav-label">المحتوى</div>
      <li class="nav-item">
        <a href="#" class="nav-link active" id="navPosts"><span>📝</span> <span>مقالاتي</span></a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" id="navPassword"><span>🔑</span> <span>تغيير كلمة المرور</span></a>
      </li>
      
      <div id="adminNav" style="display: none;">
        <div class="nav-label">الإدارة</div>
        <li class="nav-item">
          <a href="#sections" class="nav-link" id="navSections"><span>🛡️</span> <span>الأقسام</span></a>
        </li>
        <li class="nav-item">
          <a href="#users" class="nav-link" id="navUsers"><span>👥</span> <span>إدارة الصحفيين</span></a>
        </li>
        <li class="nav-item">
          <a href="#moderate" class="nav-link" id="navModerate"><span>⚖️</span> <span>المراجعة</span></a>
        </li>
      </div>
    </ul>

    <div style="margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
      <a href="index.html" class="nav-link"><span>🏠</span> <span>الموقع العام</span></a>
      <a href="#" class="nav-link" id="logoutBtn" style="color: #ff7675;"><span>🚪</span> <span>الخروج</span></a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content-dash">
    <header class="dash-header">
      <h1 id="viewTitle">لوحة التحكم</h1>
      <div id="userInfo" style="font-weight: 600;">...</div>
    </header>

    <div id="viewContainer" class="card">
      <div class="text-center p-4">
        <p>جارٍ تحميل البيانات...</p>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script type="module">
    import { renderHeader, renderFooter, showToast } from './js/main.js?v=3.2';
    import { getCurrentUser, signOut, updatePassword } from './js/auth.js?v=3.1';
    import { getPosts, savePost, deletePost, moderatePost, statusLabel } from './js/posts.js?v=3.1';
    import { getSections, getAllSections, createSection, updateSection, deleteSection } from './js/sections.js?v=3.1';
    import { supabase } from './js/supabase.js?v=3.1';

    let user = null;

    async function init() {
      user = await getCurrentUser();
      if (!user) { window.location.href = 'login.html'; return; }
      
      document.getElementById('userInfo').textContent = `مرحباً ${user.name}`;
      if (user.role === 'admin') document.getElementById('adminNav').style.display = 'block';

      // Check if journalist is validated
      if (user.role === 'journalist' && user.is_validated === false) {
        viewTitle.textContent = 'التحقق من الحساب';
        viewContainer.innerHTML = `
          <div style="text-align:center; padding: 3rem 1.5rem; font-family:'Amiri', serif;">
            <div style="font-size: 4rem; margin-bottom: 1.5rem;">⏳</div>
            <h2 style="color: var(--accent); margin-bottom: 1rem;">حسابك الصحفي قيد التفعيل</h2>
            <p style="font-size: 1.1rem; color: #555; max-width: 600px; margin: 0 auto 1.5rem; line-height: 1.6;">
              حسابك الجديد كصحفي مسجل لدينا ولكنه يحتاج إلى مراجعة وتفعيل من قبل إدارة الموقع لتتمكن من كتابة ونشر المقالات الصحفية. يرجى الانتظار حتى يتم تفعيل حسابك.
            </p>
            <a href="index.html" class="btn btn-outline" style="display: inline-block;">العودة للرئيسية</a>
          </div>
        `;
        return;
      }

      renderPostsView();
    }

    const modalOverlay = document.getElementById('modalOverlay');
    const modalContent = document.getElementById('modalContent');
    const viewContainer = document.getElementById('viewContainer');
    const viewTitle = document.getElementById('viewTitle');

    const openModal = (html) => { modalContent.innerHTML = html; modalOverlay.classList.add('open'); };
    const closeModal = () => modalOverlay.classList.remove('open');
    modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };

    // --- VIEW: POSTS ---
    async function renderPostsView(isModerate = false) {
      viewTitle.textContent = isModerate ? 'إدارة المقالات المعلقة' : 'المقالات والتدوينات';
      viewContainer.innerHTML = '<div class="text-center p-4"><strong>جارٍ تحميل المقالات...</strong></div>';
      
      try {
        const filter = isModerate ? { status: 'all' } : (user.role === 'admin' ? { status: 'all' } : { author_id: user.id, status: 'all' });
        const [posts, sections] = await Promise.all([
          getPosts(filter),
          getAllSections(true)
        ]);
        
        const uniqueAuthors = [];
        const authorMap = new Map();
        posts.forEach(p => {
          if (p.author_id && !authorMap.has(p.author_id)) {
            authorMap.set(p.author_id, p.author_name);
            uniqueAuthors.push({ id: p.author_id, name: p.author_name });
          }
        });

        let html = `
          <div class="section-title-wrap" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <p style="margin:0;">عدد المقالات المتاحة: <strong id="postsCount">${posts.length}</strong></p>
            ${!isModerate ? '<button class="btn btn-primary" id="createNewPost">+ كتابة مقال جديد</button>' : ''}
          </div>

          <div class="filters-container" style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; background: #f1f2f6; padding: 1rem; border-radius: 8px; width: 100%; box-sizing: border-box;">
            <!-- Title Search -->
            <div style="flex: 1; min-width: 200px;">
              <label class="form-label" style="font-size: 0.85rem; margin-bottom: 0.3rem;">البحث في العنوان</label>
              <input type="text" id="filterSearch" class="form-control" placeholder="اكتب للبحث..." style="padding: 0.4rem 0.8rem; font-size: 0.9rem;">
            </div>
            
            <!-- Author Filter -->
            <div style="width: 180px;">
              <label class="form-label" style="font-size: 0.85rem; margin-bottom: 0.3rem;">الكاتب</label>
              <select id="filterAuthor" class="form-control" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background: white; height: 38px;">
                <option value="all">كل الكتاب</option>
                ${uniqueAuthors.map(a => `<option value="${a.id}">${a.name}</option>`).join('')}
              </select>
            </div>

            <!-- Section Filter -->
            <div style="width: 180px;">
              <label class="form-label" style="font-size: 0.85rem; margin-bottom: 0.3rem;">القسم</label>
              <select id="filterSection" class="form-control" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background: white; height: 38px;">
                <option value="all">كل الأقسام</option>
                ${sections.map(s => `<option value="${s.id}">${s.name_ar}</option>`).join('')}
              </select>
            </div>

            <!-- Date Filter -->
            <div style="width: 180px;">
              <label class="form-label" style="font-size: 0.85rem; margin-bottom: 0.3rem;">التاريخ</label>
              <input type="date" id="filterDate" class="form-control" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; height: 38px;">
            </div>
            
            <!-- Reset Button -->
            <div style="display: flex; align-items: flex-end;">
              <button id="resetFiltersBtn" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; height: 38px;">إعادة تعيين</button>
            </div>
          </div>

          <div class="posts-list" id="dashboardPostsList">
        `;

        if (posts.length === 0) {
          html += '<p class="text-center p-4">لا توجد مقالات منشورة أو معلقة بعد.</p>';
        } else {
          posts.forEach(p => {
            const status = statusLabel(p.status);
            html += `
              <div class="list-item" data-id="${p.id}" data-section-id="${p.section_id || ''}">
                <div>
                  <div style="font-weight:700; font-size:1.15rem; margin-bottom:0.4rem;">${p.title}</div>
                  <div style="font-size:0.85rem; color:#636e72;">
                    <span class="status-badge ${status.css}" style="padding: 2px 8px; border-radius:4px; font-size:0.75rem;">${status.label}</span>
                    <span style="margin: 0 0.5rem;">|</span>
                    <span>الكاتب: ${p.author_name}</span>
                    ${p.sections ? `<span style="margin: 0 0.5rem;">|</span><span style="color:var(--accent); font-weight:600;">${p.sections.name_ar}</span>` : ''}
                  </div>
                </div>
                <div style="display:flex; gap:0.5rem;">
                  <a href="article.html?id=${p.id}" target="_blank" class="btn btn-outline" style="padding:0.4rem 0.8rem; font-size:0.85rem;">عرض</a>
                  ${!isModerate ? `<button class="btn btn-outline edit-post" data-id="${p.id}" style="padding:0.4rem 0.8rem; font-size:0.85rem;">تعديل</button>` : ''}
                  ${isModerate && user.role === 'admin' ? `
                    <button class="btn btn-primary moderate-post" data-id="${p.id}" data-status="published" style="padding:0.4rem 0.8rem; font-size:0.85rem;">تفعيل ونشر</button>
                  ` : ''}
                  ${user.role === 'admin' ? `
                    <button class="btn btn-danger delete-post" data-id="${p.id}" style="padding:0.4rem 0.8rem; font-size:0.85rem; background-color:#ff7675; color:white; border:none; border-radius:4px; cursor:pointer;">حذف</button>
                  ` : ''}
                </div>
              </div>
            `;
          });
        }
        html += '</div>';
        viewContainer.innerHTML = html;

        // Apply filtering logic
        const filterSearch = document.getElementById('filterSearch');
        const filterAuthor = document.getElementById('filterAuthor');
        const filterSection = document.getElementById('filterSection');
        const filterDate = document.getElementById('filterDate');
        const postsList = document.getElementById('dashboardPostsList');
        const postsCount = document.getElementById('postsCount');
        
        const applyFilters = () => {
          const searchQuery = filterSearch.value.toLowerCase().trim();
          const authorId = filterAuthor.value;
          const sectionId = filterSection.value;
          const selectedDate = filterDate.value; // YYYY-MM-DD
          
          const items = postsList.querySelectorAll('.list-item');
          let count = 0;
          
          items.forEach(item => {
            const pId = item.dataset.id;
            const post = posts.find(p => p.id === pId);
            if (!post) return;
            
            const matchSearch = !searchQuery || post.title.toLowerCase().includes(searchQuery);
            const matchAuthor = authorId === 'all' || post.author_id === authorId;
            const matchSection = sectionId === 'all' || post.section_id === sectionId;
            
            let matchDate = true;
            if (selectedDate) {
              const postDate = new Date(post.published_at || post.created_at).toISOString().split('T')[0];
              matchDate = postDate === selectedDate;
            }
            
            if (matchSearch && matchAuthor && matchSection && matchDate) {
              item.style.display = 'flex';
              count++;
            } else {
              item.style.display = 'none';
            }
          });
          postsCount.textContent = count;
        };

        filterSearch.oninput = applyFilters;
        filterAuthor.onchange = applyFilters;
        filterSection.onchange = applyFilters;
        filterDate.onchange = applyFilters;

        document.getElementById('resetFiltersBtn').onclick = () => {
          filterSearch.value = '';
          filterAuthor.value = 'all';
          filterSection.value = 'all';
          filterDate.value = '';
          applyFilters();
        };

        const createBtn = document.getElementById('createNewPost');
        if (createBtn) createBtn.onclick = () => renderPostEditor();
        viewContainer.querySelectorAll('.edit-post').forEach(btn => {
          btn.onclick = () => renderPostEditor(posts.find(p => p.id === btn.dataset.id));
        });
        viewContainer.querySelectorAll('.moderate-post').forEach(btn => {
          btn.onclick = async () => {
            try {
              await moderatePost(btn.dataset.id, btn.dataset.status);
              showToast('تم تعديل حالة المقال بنجاح');
              renderPostsView(true);
            } catch (err) { showToast(err.message, 'error'); }
          };
        });
        viewContainer.querySelectorAll('.delete-post').forEach(btn => {
          btn.onclick = async () => {
            if (!confirm('هل أنت متأكد من رغبتك في حذف هذا المقال نهائياً؟')) return;
            try {
              await deletePost(btn.dataset.id);
              showToast('تم حذف المقال بنجاح');
              renderPostsView(isModerate);
            } catch (err) { showToast(err.message, 'error'); }
          };
        });
      } catch (err) { viewContainer.innerHTML = `<p>فشل التحميل: ${err.message}</p>`; }
    }

    // --- VIEW: EDITOR ---
    async function renderPostEditor(post = null) {
      const isEdit = !!post;
      viewTitle.textContent = isEdit ? 'تعديل المقال' : 'مقال جديد';
      viewContainer.innerHTML = '<div class="text-center p-4"><strong>جارٍ فتح المحرر...</strong></div>';

      try {
        const sections = await getSections();
        viewContainer.innerHTML = `
          <form id="postForm">
            <div class="form-group">
              <label class="form-label">العنوان</label>
              <input type="text" class="form-control" id="postTitle" value="${post?.title || ''}" required>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
              <div class="form-group">
                <label class="form-label">القسم</label>
                <select class="form-control" id="postSection" required>
                  ${sections.map(s => `<option value="${s.id}" ${post?.section_id === s.id ? 'selected' : ''}>${s.name_ar}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">رابط الصورة</label>
                <input type="url" class="form-control" id="postImage" value="${post?.featured_image_url || ''}" placeholder="https://example.com/image.jpg">
                <div id="imagePreview" style="margin-top:0.5rem; border:1px dashed #ddd; border-radius:8px; height:100px; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#f8f9fa;">
                  ${post?.featured_image_url ? `<img src="${post.featured_image_url}" style="width:100%;height:100%;object-fit:cover;">` : '<span style="font-size:0.8rem;color:#999;">معاينة الصورة ستظهر هنا</span>'}
                </div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">المحتوى</label>
              <textarea class="form-control" id="postContent" style="min-height: 450px;" required>${post?.content || ''}</textarea>
            </div>
            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
              <button type="submit" class="btn btn-primary" id="savePostBtn">حفظ المقال</button>
              <button type="button" class="btn btn-outline" onclick="renderPostsView()">إلغاء</button>
            </div>
          </form>
        `;

        const imgInput = document.getElementById('postImage');
        const imgPreview = document.getElementById('imagePreview');
        imgInput.oninput = () => {
          const url = imgInput.value.trim();
          if (url) {
            imgPreview.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`;
          } else {
            imgPreview.innerHTML = '<span style="font-size:0.8rem;color:#999;">معاينة الصورة ستظهر هنا</span>';
          }
        };

        document.getElementById('postForm').onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById('savePostBtn');
          btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
          try {
            const payload = {
              title: document.getElementById('postTitle').value,
              section_id: document.getElementById('postSection').value,
              featured_image_url: document.getElementById('postImage').value,
              content: document.getElementById('postContent').value,
              excerpt: document.getElementById('postContent').value.substring(0, 180).replace(/<[^>]+>/g, ''),
              author_id: user.id,
              author_name: user.name,
              status: user.role === 'admin' ? 'published' : 'pending'
            };
            if (payload.status === 'published') {
              payload.published_at = new Date().toISOString();
            }
            if (isEdit) payload.id = post.id;
            
            await savePost(payload);
            showToast('تم حفظ المقال بنجاح');
            renderPostsView();
          } catch (err) { showToast(err.message, 'error'); btn.disabled = false; btn.textContent = 'حفظ المقال'; }
        };
      } catch (err) { showToast(err.message, 'error'); }
    }

    // --- VIEW: SECTIONS ---
    async function renderSectionsView() {
      viewTitle.textContent = 'إدارة الأقسام';
      viewContainer.innerHTML = '<div class="text-center p-4"><strong>جارٍ التحميل...</strong></div>';
      try {
        const sections = await getAllSections(true);
        viewContainer.innerHTML = `
          <div class="section-title-wrap" style="display:flex; justify-content:space-between; align-items:center;">
            <p>لديك <strong>${sections.length}</strong> أقسام معرفة</p>
            <button class="btn btn-primary" id="addSectionBtn">+ إضافة قسم</button>
          </div>
          <div class="sections-list">
            ${sections.map(s => `
              <div class="list-item">
                <div>
                  <div style="font-weight:700;">${s.name_ar}</div>
                  <div style="font-size:0.8rem; color:#888;">URL: /${s.slug}</div>
                </div>
                <div>
                  <button class="btn btn-outline edit-sec" data-id="${s.id}" style="padding:0.3rem 0.7rem; font-size:0.8rem;">تعديل</button>
                  <button class="btn btn-outline del-sec" data-id="${s.id}" style="padding:0.3rem 0.7rem; font-size:0.8rem; color:var(--accent);">حذف</button>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        document.getElementById('addSectionBtn').onclick = () => renderSectionModal();
        viewContainer.querySelectorAll('.edit-sec').forEach(btn => {
          btn.onclick = () => renderSectionModal(sections.find(s => s.id === btn.dataset.id));
        });
        viewContainer.querySelectorAll('.del-sec').forEach(btn => {
          btn.onclick = async () => {
            if (confirm('حذف هذا القسم؟')) {
              try { await deleteSection(btn.dataset.id); showToast('تم الحذف'); renderSectionsView(); }
              catch (err) { showToast(err.message, 'error'); }
            }
          };
        });
      } catch (err) { showToast(err.message, 'error'); }
    }

    function renderSectionModal(sec = null) {
      const isEdit = !!sec;
      openModal(`
        <h2 style="font-family:'Amiri',serif; margin-bottom:1.5rem;">${isEdit ? 'تعديل قسم' : 'إضافة قسم جديد'}</h2>
        <form id="secForm">
          <div class="form-group">
            <label class="form-label">الاسم (العربية)</label>
            <input type="text" class="form-control" id="secAr" value="${sec?.name_ar || ''}" required>
          </div>
          <div class="form-group">
            <label class="form-label">المعرف (Slug - بالإنجليزية)</label>
            <input type="text" class="form-control" id="secSlug" value="${sec?.slug || ''}" required>
          </div>
          <div class="form-group">
            <label class="form-label">رمز القسم المميز (Emoji)</label>
            <input type="text" class="form-control" id="secIcon" value="${sec?.icon || '📰'}" required>
          </div>
          <div class="form-group">
            <label class="form-label">لون القسم المميز (Accent Color)</label>
            <input type="color" class="form-control" id="secColor" value="${sec?.color || '#8b1a1a'}" style="height:40px; padding:0; width:100%;">
          </div>
          <div style="display:flex; gap:1rem; margin-top:2rem;">
            <button type="submit" class="btn btn-primary" id="saveSecBtn">حفظ القسم</button>
            <button type="button" class="btn btn-outline" id="closeModal">إلغاء</button>
          </div>
        </form>
      `);
      document.getElementById('closeModal').onclick = closeModal;
      document.getElementById('secForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveSecBtn');
        btn.disabled = true; btn.textContent = 'جاري الحفظ...';
        try {
          const payload = {
            name_ar: document.getElementById('secAr').value,
            name_en: document.getElementById('secAr').value,
            slug: document.getElementById('secSlug').value,
            icon: document.getElementById('secIcon').value,
            color: document.getElementById('secColor').value
          };
          if (isEdit) await updateSection(sec.id, payload);
          else await createSection(payload);
          showToast('تم حفظ القسم بنجاح');
          closeModal();
          renderSectionsView();
        } catch (err) { showToast(err.message, 'error'); btn.disabled = false; btn.textContent = 'حفظ القسم'; }
      };
    }

    // --- VIEW: USERS (Admin Only) ---
    async function renderUsersView() {
      viewTitle.textContent = 'إدارة حسابات الصحفيين وتفعيلها';
      viewContainer.innerHTML = '<div class="text-center p-4"><strong>جارٍ تحميل المستخدمين...</strong></div>';
      try {
        const { data: profiles, error } = await supabase.from('profiles').select('*');
        if (error) throw error;
        
        const journalists = (profiles || []).filter(p => p.role === 'journalist');
        
        let html = `
          <div class="section-title-wrap" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <p style="margin:0;">عدد الصحفيين المسجلين: <strong>${journalists.length}</strong></p>
            <button class="btn btn-primary" id="addJournalistBtn">+ إضافة صحفي جديد</button>
          </div>
          <div class="users-list">
        `;
        
        if (journalists.length === 0) {
          html += '<p class="text-center p-4">لا يوجد صحفيون معلقون أو مسجلون بعد.</p>';
        } else {
          journalists.forEach(j => {
            const isValidated = j.is_validated !== false;
            const statusText = isValidated ? 'نشط ومفعل' : 'معلق بانتظار التفعيل';
            const badgeClass = isValidated ? 'status-badge status-published' : 'status-badge status-pending';
            
            html += `
              <div class="list-item" style="display:flex; justify-content:space-between; align-items:center; padding:1rem; border-bottom:1px solid #eee;">
                <div>
                  <div style="font-weight:700; font-size:1.1rem; margin-bottom:0.25rem;">${j.name}</div>
                  <div style="font-size:0.85rem; color:#666;">
                    <span>البريد الإلكتروني: ${j.email}</span>
                    <span style="margin:0 0.5rem;">|</span>
                    <span class="${badgeClass}" style="padding:2px 8px; border-radius:4px; font-size:0.75rem;">${statusText}</span>
                  </div>
                </div>
                <div>
                  ${isValidated ? 
                    `<button class="btn btn-outline toggle-user-status" data-id="${j.id}" data-action="deactivate" style="color:#d63031; border-color:#d63031; font-size:0.85rem; padding:0.4rem 0.8rem; cursor:pointer;">إلغاء التفعيل</button>` :
                    `<button class="btn btn-primary toggle-user-status" data-id="${j.id}" data-action="activate" style="background-color:#2ecc71; border-color:#2ecc71; color:white; font-size:0.85rem; padding:0.4rem 0.8rem; cursor:pointer;">تفعيل الحساب</button>`
                  }
                </div>
              </div>
            `;
          });
        }
        
        html += '</div>';
        viewContainer.innerHTML = html;
        
        document.getElementById('addJournalistBtn').onclick = () => renderAddJournalistModal();
        
        viewContainer.querySelectorAll('.toggle-user-status').forEach(btn => {
          btn.onclick = async () => {
            const uid = btn.dataset.id;
            const act = btn.dataset.action;
            const newStatus = act === 'activate';
            btn.disabled = true;
            btn.textContent = 'جاري المعالجة...';
            try {
              // Update in profiles table
              const { error: updErr } = await supabase.from('profiles').update({ is_validated: newStatus }).eq('id', uid);
              if (updErr) throw updErr;
              
              // Also update in sa7ifa_users local session registry
              const users = JSON.parse(localStorage.getItem('sa7ifa_users')) || [];
              const uIdx = users.findIndex(u => u.id === uid);
              if (uIdx !== -1) {
                users[uIdx].is_validated = newStatus;
                localStorage.setItem('sa7ifa_users', JSON.stringify(users));
              }
              
              showToast(newStatus ? 'تم تفعيل حساب الصحفي بنجاح' : 'تم إلغاء تفعيل حساب الصحفي');
              renderUsersView();
            } catch (err) {
              showToast(err.message, 'error');
              btn.disabled = false;
              btn.textContent = act === 'activate' ? 'تفعيل الحساب' : 'إلغاء التفعيل';
            }
          };
        });
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderAddJournalistModal() {
      openModal(`
        <h2 style="font-family:'Amiri',serif; margin-bottom:1.5rem;">إضافة صحفي جديد</h2>
        <form id="addJournalistForm">
          <div class="form-group">
            <label class="form-label">الاسم الكامل</label>
            <input type="text" class="form-control" id="jName" required>
          </div>
          <div class="form-group">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" id="jEmail" required>
          </div>
          <div class="form-group">
            <label class="form-label">كلمة المرور المؤقتة</label>
            <input type="text" class="form-control" id="jPassword" placeholder="TempPass123" required minlength="6">
          </div>
          <div style="display:flex; gap:1rem; margin-top:2rem;">
            <button type="submit" class="btn btn-primary" id="saveJournalistBtn">إضافة الصحفي</button>
            <button type="button" class="btn btn-outline" id="closeModal">إلغاء</button>
          </div>
        </form>
      `);
      document.getElementById('closeModal').onclick = closeModal;
      document.getElementById('addJournalistForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveJournalistBtn');
        btn.disabled = true; btn.textContent = 'جاري الإضافة...';
        
        const name = document.getElementById('jName').value.trim();
        const email = document.getElementById('jEmail').value.trim();
        const password = document.getElementById('jPassword').value;
        
        try {
          // Check if email already exists in local registry
          const users = JSON.parse(localStorage.getItem('sa7ifa_users')) || [];
          if (users.some(u => u.email === email)) {
            throw new Error('البريد الإلكتروني مسجل بالفعل');
          }
          
          const newUserId = crypto.randomUUID ? crypto.randomUUID() : 'usr_' + Math.random().toString(36).substr(2, 9);
          
          // Add to sa7ifa_users
          users.push({
            id: newUserId,
            email: email,
            password: password,
            user_metadata: { full_name: name, role: 'journalist' },
            role: 'journalist'
          });
          localStorage.setItem('sa7ifa_users', JSON.stringify(users));
          
          // Add profile to sa7ifa_db_profiles
          const profiles = JSON.parse(localStorage.getItem('sa7ifa_db_profiles')) || [];
          profiles.push({
            id: newUserId,
            name: name,
            email: email,
            role: 'journalist',
            is_validated: true, // Auto-validate when created by admin
            created_at: new Date().toISOString()
          });
          localStorage.setItem('sa7ifa_db_profiles', JSON.stringify(profiles));
          
          showToast('تمت إضافة الصحفي وتفعيل حسابه بنجاح');
          closeModal();
          renderUsersView();
        } catch (err) {
          showToast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'إضافة الصحفي';
        }
      };
    }

    function renderPasswordView() {
      viewTitle.textContent = 'تغيير كلمة المرور';
      viewContainer.innerHTML = `
        <form id="changePasswordForm" style="max-width: 450px;">
          <div class="form-group">
            <label class="form-label">كلمة المرور الجديدة</label>
            <input type="password" class="form-control" id="newPassword" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label">تأكيد كلمة المرور الجديدة</label>
            <input type="password" class="form-control" id="confirmNewPassword" required minlength="6">
          </div>
          <div style="display:flex; gap:1rem; margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary" id="changePasswordBtn">تحديث كلمة المرور</button>
          </div>
        </form>
      `;
      
      document.getElementById('changePasswordForm').onsubmit = async (e) => {
        e.preventDefault();
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmNewPassword').value;
        
        if (newPass !== confirmPass) {
          showToast('كلمتا المرور غير متطابقتين', 'error');
          return;
        }
        
        const btn = document.getElementById('changePasswordBtn');
        btn.disabled = true; btn.textContent = 'جاري التحديث...';
        
        try {
          const res = await updatePassword(newPass);
          if (!res.success) throw new Error(res.message || 'فشل تحديث كلمة المرور');
          
          showToast('تم تغيير كلمة المرور بنجاح');
          document.getElementById('changePasswordForm').reset();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          btn.disabled = false; btn.textContent = 'تحديث كلمة المرور';
        }
      };
    }

    // --- NAV ---
    const navLinks = document.querySelectorAll('.nav-link');
    const resetNav = () => navLinks.forEach(l => l.classList.remove('active'));

    document.getElementById('navPosts').onclick = (e) => { e.preventDefault(); resetNav(); e.currentTarget.classList.add('active'); renderPostsView(); };
    document.getElementById('navSections').onclick = (e) => { e.preventDefault(); resetNav(); e.currentTarget.classList.add('active'); renderSectionsView(); };
    
    const navUsers = document.getElementById('navUsers');
    if (navUsers) {
      navUsers.onclick = (e) => { e.preventDefault(); resetNav(); e.currentTarget.classList.add('active'); renderUsersView(); };
    }
    
    document.getElementById('navModerate').onclick = (e) => { e.preventDefault(); resetNav(); e.currentTarget.classList.add('active'); renderPostsView(true); };
    document.getElementById('navPassword').onclick = (e) => { e.preventDefault(); resetNav(); e.currentTarget.classList.add('active'); renderPasswordView(); };
    document.getElementById('logoutBtn').onclick = async () => { await signOut(); window.location.href = 'index.html'; };

    init();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — الصحيفة</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="css/style.css?v=3.2">
  <link rel="stylesheet" href="css/pages.css?v=3.2">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --dash-sidebar: #121212;
      --dash-accent: #8b1a1a;
      --dash-accent-soft: #fff5f5;
      --dash-bg: #f8f9fa;
      --dash-card: #ffffff;
      --dash-text: #2d3436;
      --dash-text-muted: #636e72;
      --dash-radius: 12px;
      --dash-shadow: 0 10px 30px rgba(0,0,0,0.04);
    }

    body.dashboard-page {
      background-color: var(--dash-bg);
      font-family: 'Cairo', sans-serif;
      margin: 0;
      color: var(--dash-text);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--dash-sidebar);
      color: #fff;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
      position: fixed;
      height: 100vh;
      right: 0;
      top: 0;
      z-index: 100;
    }

    .sidebar-brand {
      font-family: 'Amiri', serif;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 1rem;
    }

    .nav-list { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
    .nav-item { margin-bottom: 0.5rem; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.9rem 1.2rem;
      color: #b2bec3;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.25s;
      font-weight: 500;
    }
    .nav-link:hover, .nav-link.active {
      background: var(--dash-accent);
      color: #fff;
    }
    .nav-label { font-size: 0.75rem; color: #636e72; text-transform: uppercase; margin: 1.5rem 1rem 0.5rem; }

    /* Main Content Area */
    .main-content-dash {
      margin-right: 280px;
      width: calc(100% - 280px);
      padding: 2rem 3rem;
      box-sizing: border-box;
    }

    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      padding: 1.5rem 0;
      border-bottom: 1px solid #e0e0e0;
    }

    #viewTitle { font-family: 'Amiri', serif; font-size: 2.4rem; margin: 0; color: var(--ink); }

    /* Content Cards */
    .card {
      background: var(--dash-card);
      border-radius: var(--dash-radius);
      box-shadow: var(--dash-shadow);
      padding: 2.5rem;
      border: 1px solid rgba(0,0,0,0.05);
    }

    /* Padding for Section Management title */
    .section-title-wrap {
       padding-bottom: 1.5rem;
       margin-bottom: 1.5rem;
       border-bottom: 1px solid #f0f0f0;
    }

    /* Lists */
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
      background: #fff;
      border: 1px solid #f0f0f0;
      border-radius: 10px;
      margin-bottom: 1rem;
      transition: transform 0.2s;
    }
    .list-item:hover { transform: scale(1.01); box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

    .btn {
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.95rem;
    }
    .btn-primary { background: var(--dash-accent); color: #fff; }
    .btn-primary:hover { background: #6b1414; box-shadow: 0 4px 12px rgba(139, 26, 26, 0.3); }
    .btn-outline { background: #fff; border: 1.5px solid #dfe6e9; color: #2d3436; }
    .btn-outline:hover { background: #f8f9fa; border-color: #b2bec3; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; width: 100%; max-width: 500px;
      border-radius: 15px; padding: 2.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
    }

    .form-group { margin-bottom: 1.5rem; }
    .form-label { display: block; margin-bottom: 0.6rem; font-weight: 700; font-size: 0.9rem; }
    .form-control {
      width: 100%; padding: 0.9rem; border: 1.5px solid #eee; border-radius: 8px;
      font-family: inherit; font-size: 1rem;
    }
    .form-control:focus { border-color: var(--dash-accent); outline: none; box-shadow: 0 0 0 3px rgba(139, 26, 26, 0.1); }

    /* Mobile / Tablet dashboard responsiveness */
    @media (max-width: 1024px) {
      .sidebar {
        right: -280px;
        transition: right 0.3s ease;
        width: 280px;
        height: 100vh;
        position: fixed;
        display: flex;
        flex-direction: column;
      }
      .sidebar.open {
        right: 0;
      }
      .sidebar-brand, .nav-link span, .nav-label {
        display: block !important;
      }
      .main-content-dash {
        margin-right: 0 !important;
        width: 100% !important;
        padding: 1.5rem;
      }
      .dash-hamburger-btn {
        display: block !important;
      }
    }
  </style>
</head>
<body class="dashboard-page">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <a href="index.html" style="display: block;">
        <img src="LOGO.png" alt="الصحيفة" style="height: 45px; margin: 0 auto; filter: brightness(0) invert(1); max-width: 100%; object-fit: contain; display: block;">
      </a>
    </div>
    <ul class="nav-list">
      <div class="nav-label">المحتوى</div>
      <li class="nav-item">
        <a href="#" class="nav-link active" id="navPosts"><span>📝</span> <span>مقالاتي</span></a>
      </li>
      <li class="nav-item">
        <a href="#" class="nav-link" id="navPassword"><span>🔑</span> <span>تغيير كلمة المرور</span></a>
      </li>

      
      <div id="adminNav" style="display: none;">
        <div class="nav-label">الإدارة</div>
        <li class="nav-item">
          <a href="#sections" class="nav-link" id="navSections"><span>🛡️</span> <span>الأقسام</span></a>
        </li>
        <li class="nav-item">
          <a href="#users" class="nav-link" id="navUsers"><span>👥</span> <span>إدارة الصحفيين</span></a>
        </li>
        <li class="nav-item">
          <a href="#moderate" class="nav-link" id="navModerate"><span>⚖️</span> <span>المراجعة</span></a>
        </li>
        <li class="nav-item">
          <a href="#settings" class="nav-link" id="navSettings"><span>⚙️</span> <span>إعدادات التسلية</span></a>
        </li>
        <li class="nav-item">
          <a href="#backup" class="nav-link" id="navBackup"><span>💾</span> <span>النسخ الاحتياطي</span></a>
        </li>
      </div>
    </ul>

    <div style="margin-top: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
      <a href="index.html" class="nav-link"><span>🏠</span> <span>الموقع العام</span></a>
      <a href="#" class="nav-link" id="logoutBtn" style="color: #ff7675;"><span>🚪</span> <span>الخروج</span></a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content-dash">
    <header class="dash-header" style="display: flex; align-items: center; gap: 1rem;">
      <button id="sidebarToggle" class="dash-hamburger-btn" style="display: none; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--dash-sidebar); padding: 0.5rem; line-height: 1;">☰</button>
      <h1 id="viewTitle" style="flex-grow: 1; margin: 0;">لوحة التحكم</h1>
      <div id="userInfo" style="font-weight: 600;">...</div>
    </header>

    <div id="viewContainer" class="card">
      <div class="text-center p-4">
        <p>جارٍ تحميل البيانات...</p>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <script type="module">
    import { renderHeader, renderFooter, showToast } from './js/main.js?v=3.6';
    import { getCurrentUser, signOut, updatePassword } from './js/auth.js?v=3.6';
    import { getPosts, savePost, deletePost, moderatePost, statusLabel } from './js/posts.js?v=3.6';
    import { getSections, getAllSections, createSection, updateSection, deleteSection } from './js/sections.js?v=3.6';
    import { supabase } from './js/supabase.js?v=3.6';

    let user = null;
    let currentFilters = {
      search: '',
      author: 'all',
      section: 'all',
      date: ''
    };

    async function init() {
      user = await getCurrentUser();
      if (!user) { window.location.href = 'login.html'; return; }
      
      document.getElementById('userInfo').textContent = `مرحباً ${user.name}`;
      if (user.role === 'admin') document.getElementById('adminNav').style.display = 'block';

      // Sidebar Mobile Toggle
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebar = document.querySelector('.sidebar');
      if (sidebarToggle && sidebar) {
        sidebarToggle.onclick = (e) => {
          e.stopPropagation();
          sidebar.classList.toggle('open');
        };
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.sidebar') && !e.target.closest('#sidebarToggle')) {
            sidebar.classList.remove('open');
          }
        });
      }

      // Check if journalist is validated
      if (user.role === 'journalist' && user.is_validated === false) {
        viewTitle.textContent = 'التحقق من الحساب';
        viewContainer.innerHTML = `
          <div style="text-align:center; padding: 3rem 1.5rem; font-family:'Amiri', serif;">
            <div style="font-size: 4rem; margin-bottom: 1.5rem;">⏳</div>
            <h2 style="color: var(--accent); margin-bottom: 1rem;">حسابك الصحفي قيد التفعيل</h2>
            <p style="font-size: 1.1rem; color: #555; max-width: 600px; margin: 0 auto 1.5rem; line-height: 1.6;">
              حسابك الجديد كصحفي مسجل لدينا ولكنه يحتاج إلى مراجعة وتفعيل من قبل إدارة الموقع لتتمكن من كتابة ونشر المقالات الصحفية. يرجى الانتظار حتى يتم تفعيل حسابك.
            </p>
            <a href="index.html" class="btn btn-outline" style="display: inline-block;">العودة للرئيسية</a>
          </div>
        `;
        return;
      }

      handleHashRoute();
    }

    const modalOverlay = document.getElementById('modalOverlay');
    const modalContent = document.getElementById('modalContent');
    const viewContainer = document.getElementById('viewContainer');
    const viewTitle = document.getElementById('viewTitle');

    const openModal = (html) => { modalContent.innerHTML = html; modalOverlay.classList.add('open'); };
    const closeModal = () => modalOverlay.classList.remove('open');
    modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };

    // --- VIEW: POSTS ---
    async function renderPostsView(isModerate = false) {
      viewTitle.textContent = isModerate ? 'إدارة المقالات المعلقة' : 'المقالات والتدوينات';
      viewContainer.innerHTML = '<div class="text-center p-4"><strong>جارٍ تحميل المقالات...</strong></div>';
      
      try {
        const filter = isModerate ? { status: 'all' } : (user.role === 'admin' ? { status: 'all' } : { author_id: user.id, status: 'all' });
        const [posts, sections] = await Promise.all([
          getPosts(filter),
          getAllSections(true)
        ]);
        
        const uniqueAuthors = [];
        const authorMap = new Map();
        posts.forEach(p => {
          if (p.author_id && !authorMap.has(p.author_id)) {
            authorMap.set(p.author_id, p.author_name);
            uniqueAuthors.push({ id: p.author_id, name: p.author_name });
          }
        });

        let html = `
          <div class="section-title-wrap" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <p style="margin:0;">عدد المقالات المتاحة: <strong id="postsCount">${posts.length}</strong></p>
            ${!isModerate ? '<button class="btn btn-primary" id="createNewPost">+ كتابة مقال جديد</button>' : ''}
          </div>

          <div class="filters-container" style="display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; background: #f1f2f6; padding: 1rem; border-radius: 8px; width: 100%; box-sizing: border-box;">
            <!-- Title Search -->
            <div style="flex: 1; min-width: 200px;">
              <label class="form-label" style="font-size: 0.85rem; margin-bottom: 0.3rem;">البحث في العنوان</label>
              <input type="text" id="filterSearch" class="form-control" placeholder="اكتب للبحث..." style="padding: 0.4rem 0.8rem; font-size: 0.9rem;" value="${currentFilters.search}">
            </div>
            
            <!-- Author Filter -->
            <div style="width: 180px;">
              <label class="form-label" style="font-size: 0.85rem; margin-bottom: 0.3rem;">الكاتب</label>
              <select id="filterAuthor" class="form-control" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background: white; height: 38px;">
                <option value="all" ${currentFilters.author === 'all' ? 'selected' : ''}>كل الكتاب</option>
                ${uniqueAuthors.map(a => `<option value="${a.id}" ${currentFilters.author === a.id ? 'selected' : ''}>${a.name}</option>`).join('')}
              </select>
            </div>

            <!-- Section Filter -->
            <div style="width: 180px;">
              <label class="form-label" style="font-size: 0.85rem; margin-bottom: 0.3rem;">القسم</label>
              <select id="filterSection" class="form-control" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; background: white; height: 38px;">
                <option value="all" ${currentFilters.section === 'all' ? 'selected' : ''}>كل الأقسام</option>
                ${sections.map(s => `<option value="${s.id}" ${currentFilters.section === s.id ? 'selected' : ''}>${s.name_ar}</option>`).join('')}
              </select>
            </div>

            <!-- Date Filter -->
            <div style="width: 180px;">
              <label class="form-label" style="font-size: 0.85rem; margin-bottom: 0.3rem;">التاريخ</label>
              <input type="date" id="filterDate" class="form-control" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; height: 38px;" value="${currentFilters.date}">
            </div>
            
            <!-- Reset Button -->
            <div style="display: flex; align-items: flex-end;">
              <button id="resetFiltersBtn" class="btn btn-outline" style="padding: 0.4rem 0.8rem; font-size: 0.9rem; height: 38px;">إعادة تعيين</button>
            </div>
          </div>

          <div class="posts-list" id="dashboardPostsList">
        `;

        if (posts.length === 0) {
          html += '<p class="text-center p-4">لا توجد مقالات منشورة أو معلقة بعد.</p>';
        } else {
          posts.forEach(p => {
            const status = statusLabel(p.status);
            html += `
              <div class="list-item" data-id="${p.id}" data-section-id="${p.section_id || ''}">
                <div>
                  <div style="font-weight:700; font-size:1.15rem; margin-bottom:0.4rem;">${p.title}</div>
                  <div style="font-size:0.85rem; color:#636e72;">
                    <span class="status-badge ${status.css}" style="padding: 2px 8px; border-radius:4px; font-size:0.75rem;">${status.label}</span>
                    <span style="margin: 0 0.5rem;">|</span>
                    <span>الكاتب: ${p.author_name}</span>
                    ${p.sections ? `<span style="margin: 0 0.5rem;">|</span><span style="color:var(--accent); font-weight:600;">${p.sections.name_ar}</span>` : ''}
                  </div>
                </div>
                <div style="display:flex; gap:0.5rem;">
                  <a href="article.html?id=${p.id}" target="_blank" class="btn btn-outline" style="padding:0.4rem 0.8rem; font-size:0.85rem;">عرض</a>
                  ${!isModerate ? `<button class="btn btn-outline edit-post" data-id="${p.id}" style="padding:0.4rem 0.8rem; font-size:0.85rem;">تعديل</button>` : ''}
                  ${isModerate && user.role === 'admin' ? `
                    <button class="btn btn-primary moderate-post" data-id="${p.id}" data-status="published" style="padding:0.4rem 0.8rem; font-size:0.85rem;">تفعيل ونشر</button>
                  ` : ''}
                  ${user.role === 'admin' ? `
                    <button class="btn btn-danger delete-post" data-id="${p.id}" style="padding:0.4rem 0.8rem; font-size:0.85rem; background-color:#ff7675; color:white; border:none; border-radius:4px; cursor:pointer;">حذف</button>
                  ` : ''}
                </div>
              </div>
            `;
          });
        }
        html += '</div>';
        viewContainer.innerHTML = html;

        // Apply filtering logic
        const filterSearch = document.getElementById('filterSearch');
        const filterAuthor = document.getElementById('filterAuthor');
        const filterSection = document.getElementById('filterSection');
        const filterDate = document.getElementById('filterDate');
        const postsList = document.getElementById('dashboardPostsList');
        const postsCount = document.getElementById('postsCount');
        
        const applyFilters = () => {
          const searchQuery = filterSearch.value.toLowerCase().trim();
          const authorId = filterAuthor.value;
          const sectionId = filterSection.value;
          const selectedDate = filterDate.value; // YYYY-MM-DD
          
          currentFilters = {
            search: filterSearch.value,
            author: authorId,
            section: sectionId,
            date: selectedDate
          };
          
          const items = postsList.querySelectorAll('.list-item');
          let count = 0;
          
          items.forEach(item => {
            const pId = item.dataset.id;
            const post = posts.find(p => p.id === pId);
            if (!post) return;
            
            const matchSearch = !searchQuery || post.title.toLowerCase().includes(searchQuery);
            const matchAuthor = authorId === 'all' || post.author_id === authorId;
            const matchSection = sectionId === 'all' || post.section_id === sectionId;
            
            let matchDate = true;
            if (selectedDate) {
              const postDate = new Date(post.published_at || post.created_at).toISOString().split('T')[0];
              matchDate = postDate === selectedDate;
            }
            
            if (matchSearch && matchAuthor && matchSection && matchDate) {
              item.style.display = 'flex';
              count++;
            } else {
              item.style.display = 'none';
            }
          });
          postsCount.textContent = count;
        };

        filterSearch.oninput = applyFilters;
        filterAuthor.onchange = applyFilters;
        filterSection.onchange = applyFilters;
        filterDate.onchange = applyFilters;

        document.getElementById('resetFiltersBtn').onclick = () => {
          filterSearch.value = '';
          filterAuthor.value = 'all';
          filterSection.value = 'all';
          filterDate.value = '';
          currentFilters = { search: '', author: 'all', section: 'all', date: '' };
          applyFilters();
        };

        const createBtn = document.getElementById('createNewPost');
        if (createBtn) createBtn.onclick = () => renderPostEditor();
        viewContainer.querySelectorAll('.edit-post').forEach(btn => {
          btn.onclick = () => renderPostEditor(posts.find(p => p.id === btn.dataset.id));
        });
        viewContainer.querySelectorAll('.moderate-post').forEach(btn => {
          btn.onclick = async () => {
            try {
              await moderatePost(btn.dataset.id, btn.dataset.status);
              showToast('تم تعديل حالة المقال بنجاح');
              renderPostsView(true);
            } catch (err) { showToast(err.message, 'error'); }
          };
        });
        viewContainer.querySelectorAll('.delete-post').forEach(btn => {
          btn.onclick = async () => {
            if (!confirm('هل أنت متأكد من رغبتك في حذف هذا المقال نهائياً؟')) return;
            try {
              await deletePost(btn.dataset.id);
              showToast('تم حذف المقال بنجاح');
              renderPostsView(isModerate);
            } catch (err) { showToast(err.message, 'error'); }
          };
        });
        
        applyFilters();
      } catch (err) { viewContainer.innerHTML = `<p>فشل التحميل: ${err.message}</p>`; }
    }

    // --- VIEW: EDITOR ---
    async function renderPostEditor(post = null) {
      const isEdit = !!post;
      viewTitle.textContent = isEdit ? 'تعديل المقال' : 'مقال جديد';
      viewContainer.innerHTML = '<div class="text-center p-4"><strong>جارٍ فتح المحرر...</strong></div>';

      try {
        const sections = await getSections();
        
        // Inject RTE CSS styles
        if (!document.getElementById('rte-styles')) {
          const style = document.createElement('style');
          style.id = 'rte-styles';
          style.innerHTML = `
            .rte-container { border: 1.5px solid #eee; border-radius: 8px; overflow: hidden; background: #fff; margin-bottom: 1.5rem; }
            .rte-toolbar { background: #f8f9fa; border-bottom: 1.5px solid #eee; padding: 0.5rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
            .rte-btn { border: 1.5px solid #dfe6e9 !important; background: #ffffff !important; color: #2d3436 !important; border-radius: 6px !important; padding: 5px 10px !important; font-size: 0.9rem !important; cursor: pointer !important; transition: all 0.2s !important; display: inline-flex !important; align-items: center; gap: 4px; }
            .rte-btn:hover { background: #f1f2f6 !important; border-color: #b2bec3 !important; }
            .rte-select { border: 1.5px solid #dfe6e9 !important; background: #ffffff !important; color: #2d3436 !important; border-radius: 6px !important; padding: 5px !important; font-size: 0.9rem !important; cursor: pointer !important; }
            .rte-editor { min-height: 400px; max-height: 600px; overflow-y: auto; padding: 1.2rem; border: none; outline: none; background: #fff; font-family: 'Noto Naskh Arabic', serif !important; font-size: 1.1rem; line-height: 1.8; color: #2b2b2b; text-align: right; }
            .rte-editor h2, .rte-editor h3, .rte-editor h4 { font-family: 'Amiri', serif !important; color: #8b1a1a; margin-top: 1rem; margin-bottom: 0.5rem; }
            .rte-editor p { margin-bottom: 1rem; }
          `;
          document.head.appendChild(style);
        }

        viewContainer.innerHTML = `
          <form id="postForm">
            <div class="form-group">
              <label class="form-label">العنوان</label>
              <input type="text" class="form-control" id="postTitle" value="${post?.title || ''}" required>
            </div>

                    <option value="">تنسيق العناوين</option>

                    <option value="H3">عنوان فرعي (H3)</option>

              <button type="button" class="btn btn-outline" onclick="renderPostsView()">إلغاء</button>
            </div>
          </form>
        `;

        const imgLinkRadio = document.getElementById('imgSourceLink');
        const imgUploadRadio = document.getElementById('imgSourceUpload');
        const imgLinkContainer = document.getElementById('imgLinkContainer');
        const imgUploadContainer = document.getElementById('imgUploadContainer');
        const imgInput = document.getElementById('postImage');
        const imgFileInput = document.getElementById('postImageFile');
        const imgPreview = document.getElementById('imagePreview');

        imgLinkRadio.onchange = () => {
          imgLinkContainer.style.display = 'block';
          imgUploadContainer.style.display = 'none';
        };
        imgUploadRadio.onchange = () => {
          imgLinkContainer.style.display = 'none';
          imgUploadContainer.style.display = 'block';
        };

        if (post?.featured_image_url && post.featured_image_url.startsWith('data:image')) {
          imgUploadRadio.checked = true;
          imgLinkContainer.style.display = 'none';
          imgUploadContainer.style.display = 'block';
        }

        imgInput.oninput = () => {
          const url = imgInput.value.trim();
          if (url) {
            imgPreview.innerHTML = `<img src="${url}" style="width:100%;height:100%;object-fit:cover;">`;
          } else {
            imgPreview.innerHTML = '<span style="font-size:0.8rem;color:#999;">معاينة الصورة ستظهر هنا</span>';
          }
        };

        imgFileInput.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (event) => {
              const dataUrl = event.target.result;
              imgInput.value = dataUrl;
              imgPreview.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:cover;">`;
            };
            reader.readAsDataURL(file);
          }
        };

        // WYSIWYG command handlers
        const editor = document.getElementById('postContentEditor');
        const toolbar = document.querySelector('.rte-toolbar');

        toolbar.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-command]');
          if (!btn) return;
          const cmd = btn.dataset.command;
          
          e.preventDefault();
          if (cmd === 'bold' || cmd === 'insertOrderedList') {
            document.execCommand(cmd, false, null);
          }
          editor.focus();
        });

        const fontSelect = toolbar.querySelector('select[data-command="fontSize"]');
        fontSelect.onchange = () => {
          const val = fontSelect.value;
          if (val) {
            document.execCommand('fontSize', false, val);
          }
          fontSelect.value = '';
          editor.focus();
        };

        const colorInput = toolbar.querySelector('input[data-command="foreColor"]');
        colorInput.onchange = () => {
          const val = colorInput.value;
          if (val) {
            document.execCommand('foreColor', false, val);
          }
          editor.focus();
        };

        const headingSelect = toolbar.querySelector('select[data-command="heading"]');
        headingSelect.onchange = () => {
          const val = headingSelect.value;
          if (val) {
            if (val === 'P') {
              document.execCommand('formatBlock', false, '<p>');
            } else {
              document.execCommand('formatBlock', false, '<' + val + '>');
            }
          }
          headingSelect.value = '';
          editor.focus();
        };

        const numberHeadingsBtn = document.getElementById('btnNumberHeadings');
        numberHeadingsBtn.onclick = (e) => {
          e.preventDefault();
          
          const headings = editor.querySelectorAll('h2, h3, h4');
          let h2Count = 0;
          let h3Count = 0;
          let h4Count = 0;
          
          headings.forEach(heading => {
            let text = heading.innerHTML.replace(/^\d+(\.\d+)*\.?\s+/, '');
            const tag = heading.tagName.toLowerCase();
            
            if (tag === 'h2') {
              h2Count++;
              h3Count = 0;
              h4Count = 0;
              heading.innerHTML = `${h2Count}. ${text}`;
            } else if (tag === 'h3') {
              h3Count++;
              h4Count = 0;
              heading.innerHTML = `${h2Count}.${h3Count}. ${text}`;
            } else if (tag === 'h4') {
              h4Count++;
              heading.innerHTML = `${h2Count}.${h3Count}.${h4Count}. ${text}`;
            }
          });
          editor.focus();
        };

        document.getElementById('postForm').onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById('savePostBtn');
          btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
          try {
            const editorContent = editor.innerHTML;
            const payload = {
              title: document.getElementById('postTitle').value,
              section_id: document.getElementById('postSection').value,
              featured_image_url: imgInput.value,
              content: editorContent,
              excerpt: editorContent.substring(0, 180).replace(/<[^>]+>/g, ''),
              author_id: user.id,
              author_name: user.name,
              status: user.role === 'admin' ? 'published' : 'pending'
            };
            if (payload.status === 'published') {
              payload.published_at = new Date().toISOString();
            }
            if (isEdit) payload.id = post.id;
            
            await savePost(payload);
            showToast('تم حفظ المقال بنجاح');
            renderPostsView();
          } catch (err) { showToast(err.message, 'error'); btn.disabled = false; btn.textContent = 'حفظ المقال'; }
        };
      } catch (err) { showToast(err.message, 'error'); }
    }

    async function renderFeaturedPostsModal(sectionId) {
      openModal('<div class="text-center p-4"><strong>جاري تحميل المقالات...</strong></div>');
      try {
        const [posts, sections] = await Promise.all([
          getPosts({ status: 'published' }),
          getAllSections(true)
        ]);
        const sec = sections.find(s => s.id === sectionId);
        if (!sec) throw new Error('القسم غير موجود');

        const secPosts = sec.slug === 'home' ? posts : posts.filter(p => p.section_id === sectionId);
        const currentFeatured = sec.featured_posts || [];

        let html = `
          <h2 style="font-family:'Amiri',serif; margin-bottom:1rem;">اختر 5 مقالات للرئيسية - قسم ${sec.name_ar}</h2>
          <p style="font-size:0.85rem; color:#666; margin-bottom:1.5rem;">يرجى تحديد 5 مقالات كحد أقصى ليتم عرضها في الصفحة الرئيسية ضمن هذا القسم.</p>
          <form id="featuredPostsForm">
            <div style="max-height: 350px; overflow-y: auto; border: 1px solid #eee; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;">

        if (secPosts.length === 0) {
          html += '<p class="text-center p-4">لا توجد مقالات منشورة في هذا القسم.</p>';
        } else {
          secPosts.forEach(p => {
            const isChecked = currentFeatured.includes(p.id) ? 'checked' : '';
            html += `
              <div style="display:flex; align-items:flex-start; gap:0.5rem; margin-bottom:1rem; border-bottom:1px solid #f9f9f9; padding-bottom:0.5rem;">
                <input type="checkbox" class="featured-post-check" value="${p.id}" ${isChecked} style="margin-top:0.3rem; width:18px; height:18px; cursor:pointer;">
                <label style="cursor:pointer; font-size:0.95rem; text-align:right; flex-grow:1;">
                  <strong>${p.title}</strong><br>
                  <small style="color:#888;">الكاتب: ${p.author_name} | التاريخ: ${new Date(p.published_at).toLocaleDateString('ar-EG')}</small>
                </label>
              </div>
            `;
          });
        }

        html += `
            </div>
            <div style="display:flex; gap:1rem; margin-top:1.5rem;">
              <button type="submit" class="btn btn-primary" id="saveFeaturedBtn" ${secPosts.length === 0 ? 'disabled' : ''}>حفظ التحديد</button>
              <button type="button" class="btn btn-outline" id="closeFeaturedModal">إلغاء</button>
            </div>
          </form>
        `;

        openModal(html);
        document.getElementById('closeFeaturedModal').onclick = closeModal;

        const checkboxes = document.querySelectorAll('.featured-post-check');
        const updateCheckboxStates = () => {
          const checkedCount = document.querySelectorAll('.featured-post-check:checked').length;
          checkboxes.forEach(cb => {
            if (!cb.checked) {
              cb.disabled = checkedCount >= 5;
            }
          });
        };

        checkboxes.forEach(cb => {
          cb.onchange = updateCheckboxStates;
        });

        updateCheckboxStates();

        document.getElementById('featuredPostsForm').onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById('saveFeaturedBtn');
          btn.disabled = true; btn.textContent = 'جاري الحفظ...';

          const selectedIds = Array.from(document.querySelectorAll('.featured-post-check:checked')).map(cb => cb.value);

          try {
            await updateSection(sectionId, { featured_posts: selectedIds });
            showToast('تم حفظ المقالات المختارة للرئيسية بنجاح');
            closeModal();
            renderSectionsView();
          } catch (err) {
            showToast(err.message, 'error');
            btn.disabled = false;
            btn.textContent = 'حفظ التحديد';
          }
        };

      } catch (err) {
        showToast(err.message, 'error');
      }
    }

      viewTitle.textContent = 'إدارة حسابات الصحفيين وتفعيلها';

        const journalists = (profiles || []).filter(p => p.role === 'journalist');

            const isValidated = j.is_validated !== false;
            const statusText = isValidated ? 'نشط ومفعل' : 'معلق بانتظار التفعيل';
            const badgeClass = isValidated ? 'status-badge status-published' : 'status-badge status-pending';
            
            html += `
              <div class="list-item" style="display:flex; justify-content:space-between; align-items:center; padding:1rem; border-bottom:1px solid #eee;">

                  <div style="font-weight:700; font-size:1.1rem; margin-bottom:0.25rem;">${j.name}</div>
                  <div style="font-size:0.85rem; color:#666;">
                    <span>البريد الإلكتروني: ${j.email}</span>
                    <span style="margin:0 0.5rem;">|</span>
                    <span class="${badgeClass}" style="padding:2px 8px; border-radius:4px; font-size:0.75rem;">${statusText}</span>
                  </div>
                </div>
                <div>
                  ${isValidated ? 
                    `<button class="btn btn-outline toggle-user-status" data-id="${j.id}" data-action="deactivate" style="color:#d63031; border-color:#d63031; font-size:0.85rem; padding:0.4rem 0.8rem; cursor:pointer;">إلغاء التفعيل</button>` :
                    `<button class="btn btn-primary toggle-user-status" data-id="${j.id}" data-action="activate" style="background-color:#2ecc71; border-color:#2ecc71; color:white; font-size:0.85rem; padding:0.4rem 0.8rem; cursor:pointer;">تفعيل الحساب</button>`
                  }
                </div>
              </div>
            `;
          });
        }
        
        html += '</div>';
        viewContainer.innerHTML = html;
        
        document.getElementById('addJournalistBtn').onclick = () => renderAddJournalistModal();
        
        viewContainer.querySelectorAll('.toggle-user-status').forEach(btn => {
          btn.onclick = async () => {
            const uid = btn.dataset.id;
            const act = btn.dataset.action;
            const newStatus = act === 'activate';
            btn.disabled = true;
            btn.textContent = 'جاري المعالجة...';
            try {
              // Update in profiles table
              const { error: updErr } = await supabase.from('profiles').update({ is_validated: newStatus }).eq('id', uid);
              if (updErr) throw updErr;
              
              // Also update in sa7ifa_users local session registry
              const users = JSON.parse(localStorage.getItem('sa7ifa_users')) || [];
              const uIdx = users.findIndex(u => u.id === uid);
              if (uIdx !== -1) {
                users[uIdx].is_validated = newStatus;
                localStorage.setItem('sa7ifa_users', JSON.stringify(users));
              }
              
              showToast(newStatus ? 'تم تفعيل حساب الصحفي بنجاح' : 'تم إلغاء تفعيل حساب الصحفي');
              renderUsersView();
            } catch (err) {
              showToast(err.message, 'error');
              btn.disabled = false;
              btn.textContent = act === 'activate' ? 'تفعيل الحساب' : 'إلغاء التفعيل';
            }
          };
        });
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

          const users = JSON.parse(localStorage.getItem('sa7ifa_users')) || [];
          if (users.some(u => u.email === email)) {
            throw new Error('البريد الإلكتروني مسجل بالفعل');
          }
          
          const newUserId = crypto.randomUUID ? crypto.randomUUID() : 'usr_' + Math.random().toString(36).substr(2, 9);
          
          // Add to sa7ifa_users
          users.push({
            id: newUserId,
            email: email,
            password: password,
            user_metadata: { full_name: name, role: 'journalist' },
            role: 'journalist'
          });
          localStorage.setItem('sa7ifa_users', JSON.stringify(users));
          
          // Add profile to sa7ifa_db_profiles
          const profiles = JSON.parse(localStorage.getItem('sa7ifa_db_profiles')) || [];
          profiles.push({
            id: newUserId,
            name: name,
            email: email,
            role: 'journalist',
            is_validated: true, // Auto-validate when created by admin
            created_at: new Date().toISOString()
          });
          localStorage.setItem('sa7ifa_db_profiles', JSON.stringify(profiles));
          
          showToast('تمت إضافة الصحفي وتفعيل حسابه بنجاح');
          closeModal();
          renderUsersView();
        } catch (err) {
          showToast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'إضافة الصحفي';
        }
      };
    }

    async function renderBackupView() {
      viewTitle.textContent = 'النسخ الاحتياطي واستعادة البيانات';
      viewContainer.innerHTML = `
        <div style="max-width: 600px; font-family: 'Cairo', sans-serif;">
          <h3 style="font-family:'Amiri',serif; margin-bottom:1rem; color:var(--dash-accent); font-size:1.4rem;">نسخ المقالات وتصديرها</h3>
          <p style="font-size:0.95rem; color:#555; line-height:1.6; margin-bottom:1.5rem;">
            يمكنك تحميل نسخة احتياطية كاملة من جميع المقالات والتدوينات الموجودة في قاعدة البيانات حالياً (بما في ذلك العناوين، المحتوى، الصور، التواريخ والأقسام) وحفظها محلياً بصيغة ملف <strong style="color:var(--dash-accent);">JSON</strong>.
          </p>
          <button class="btn btn-primary" id="btnExportBackup" style="margin-bottom:2.5rem;">
            <span>💾</span> تصدير وتحميل النسخة الاحتياطية
          </button>

          <div style="border-top: 1px dashed #ccc; padding-top:2rem; margin-top:1.5rem;">
            <h3 style="font-family:'Amiri',serif; margin-bottom:1rem; color:var(--dash-accent); font-size:1.4rem;">استيراد واستعادة المقالات</h3>
            <p style="font-size:0.95rem; color:#555; line-height:1.6; margin-bottom:1.5rem;">
              اختر ملف نسخة احتياطية بصيغة <strong style="color:var(--dash-accent);">JSON</strong> قمت بتحميله مسبقاً لاستيراد المقالات وإضافتها إلى الجريدة.
            </p>
            <div class="form-group" style="margin-bottom:1.5rem;">
              <input type="file" id="importBackupFile" accept=".json" class="form-control" style="padding: 0.5rem;">
            </div>
            <button class="btn btn-outline" id="btnImportBackup" disabled>
              <span>📂</span> تحميل واستعادة البيانات
            </button>
          </div>
        </div>
      `;

      const fileInput = document.getElementById('importBackupFile');
      const importBtn = document.getElementById('btnImportBackup');
      fileInput.onchange = () => {
        importBtn.disabled = !fileInput.files.length;
      };

      document.getElementById('btnExportBackup').onclick = async () => {
        const btn = document.getElementById('btnExportBackup');
        btn.disabled = true; btn.textContent = 'جاري تحضير البيانات...';
        try {
          const { data, error } = await supabase.from('posts').select('*');
          if (error) throw error;
          
          const backup = {
            backup_date: new Date().toISOString(),
            posts: data || []
          };
          
          const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `sa7ifa_backup_${new Date().toISOString().slice(0, 10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('تم تصدير وتحميل النسخة الاحتياطية بنجاح');
        } catch(e) {
          showToast(e.message, 'error');
        } finally {
          btn.disabled = false; btn.innerHTML = '<span>💾</span> تصدير وتحميل النسخة الاحتياطية';
        }
      };

      importBtn.onclick = async () => {
        const file = fileInput.files[0];
        if (!file) return;

        importBtn.disabled = true; importBtn.textContent = 'جاري القراءة...';
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!data.posts || !Array.isArray(data.posts)) {
              throw new Error('تنسيق ملف النسخة الاحتياطية غير صالح. يجب أن يحتوي على قائمة المقالات.');
            }

            importBtn.textContent = 'جاري فحص الأقسام...';
            const sections = await getAllSections(true);
            const activeSectionIds = sections.map(s => s.id);
            const defaultSectionId = activeSectionIds.length > 0 ? activeSectionIds[0] : null;

            importBtn.textContent = 'جاري استيراد المقالات...';
            
            const postsToInsert = data.posts.map(p => {
              const postCopy = { ...p };
              delete postCopy.id;
              postCopy.slug = (postCopy.slug || 'imported-article') + '-' + Math.floor(Math.random() * 10000);
              postCopy.author_id = user.id;
              postCopy.author_name = user.name;
              
              if (postCopy.section_id && !activeSectionIds.includes(postCopy.section_id)) {
                postCopy.section_id = defaultSectionId;
              }
              
              postCopy.created_at = postCopy.created_at || new Date().toISOString();
              postCopy.updated_at = new Date().toISOString();
              postCopy.published_at = postCopy.published_at || new Date().toISOString();
              
              return postCopy;
            });

            if (postsToInsert.length === 0) {
              throw new Error('الملف لا يحتوي على أي مقالات لاستيرادها.');
            }

            const { error: insErr } = await supabase.from('posts').insert(postsToInsert);
            if (insErr) throw insErr;

            showToast(`تم استعادة واستيراد ${postsToInsert.length} مقال بنجاح!`);
            fileInput.value = '';
            importBtn.disabled = true;
          } catch(err) {
            showToast(err.message, 'error');
          } finally {
            importBtn.disabled = false; importBtn.innerHTML = '<span>📂</span> تحميل واستعادة البيانات';
          }
        };
        reader.readAsText(file);
      };
    }

    async function renderSettingsView() {
      viewTitle.textContent = 'إعدادات صفحة التسلية والمنوعات';
      viewContainer.innerHTML = '<div class="text-center p-4"><strong>جاري تحميل الإعدادات...</strong></div>';
      try {
        const { data, error } = await supabase.from('site_settings').select('*').eq('id', 1).maybeSingle();
        if (error) throw error;
        const settings = data || {
          weather_temp: "28",
          weather_desc: "صحو دافئ مع رياح شرقية خفيفة",
          exchange_rates: "الليرة الذهبية: 450 قرشاً | الريال المجيدي: 22 قرشاً | الجنيه الاسترليني: 110 قروش",
          quote_text: "إن صحيفتنا هذه ليست مجرد ناقل للأخبار، بل هي منبر للأحرار وسجل لتاريخ الأمة الحقيقي.",
          quote_author: "أديب إسحاق"
        };

        viewContainer.innerHTML = `
          <form id="settingsForm" style="max-width: 600px;">
            <h3 style="font-family:'Amiri',serif; margin-bottom:1rem; color:var(--dash-accent); font-size:1.2rem;">أحوال الطقس</h3>
            <div style="display:grid; grid-template-columns:1fr 2fr; gap:1rem; margin-bottom: 1.5rem;">
              <div class="form-group">
                <label class="form-label">درجة الحرارة (°م)</label>
                <input type="text" class="form-control" id="settTemp" value="${settings.weather_temp || ''}" required>
              </div>
              <div class="form-group">
                <label class="form-label">حالة الطقس العامة</label>
                <input type="text" class="form-control" id="settDesc" value="${settings.weather_desc || ''}" required>
              </div>
            </div>

            <h3 style="font-family:'Amiri',serif; margin-bottom:1rem; color:var(--dash-accent); font-size:1.2rem;">أسعار الصرف (العملات الكلاسيكية)</h3>
            <div class="form-group" style="margin-bottom: 1.5rem;">
              <label class="form-label">شريط العملات والصرف</label>
              <textarea class="form-control" id="settRates" style="min-height:80px;" required>${settings.exchange_rates || ''}</textarea>
              <small style="color:#666; font-size:0.8rem; display:block; margin-top:0.25rem;">افصل بين العملات برمز العمود العمودي |</small>
            </div>

            <h3 style="font-family:'Amiri',serif; margin-bottom:1rem; color:var(--dash-accent); font-size:1.2rem;">حكمة اليوم / مقولات خالدة</h3>
            <div class="form-group" style="margin-bottom: 1rem;">
              <label class="form-label">نص المقولة</label>
              <textarea class="form-control" id="settQuote" style="min-height:80px;" required>${settings.quote_text || ''}</textarea>
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
              <label class="form-label">صاحب المقولة</label>
              <input type="text" class="form-control" id="settAuthor" value="${settings.quote_author || ''}" required>
            </div>

            <div style="display:flex; gap:1rem; margin-top:2rem;">
              <button type="submit" class="btn btn-primary" id="saveSettingsBtn">حفظ التغييرات</button>
            </div>
          </form>
        `;

        document.getElementById('settingsForm').onsubmit = async (e) => {
          e.preventDefault();
          const btn = document.getElementById('saveSettingsBtn');
          btn.disabled = true; btn.textContent = 'جاري الحفظ...';

          try {
            const payload = {
              weather_temp: document.getElementById('settTemp').value.trim(),
              weather_desc: document.getElementById('settDesc').value.trim(),
              exchange_rates: document.getElementById('settRates').value.trim(),
              quote_text: document.getElementById('settQuote').value.trim(),
              quote_author: document.getElementById('settAuthor').value.trim()
            };

            const { error: updErr } = await supabase.from('site_settings').update(payload).eq('id', 1);
            if (updErr) throw updErr;

            showToast('تم حفظ إعدادات التسلية بنجاح');
          } catch (err) {
            showToast(err.message, 'error');
          } finally {
            btn.disabled = false; btn.textContent = 'حفظ التغييرات';
          }
        };

      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderPasswordView() {
      viewTitle.textContent = 'تغيير كلمة المرور';
      viewContainer.innerHTML = `
        <form id="changePasswordForm" style="max-width: 450px;">
          <div class="form-group">
            <label class="form-label">كلمة المرور الجديدة</label>
            <input type="password" class="form-control" id="newPassword" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label">تأكيد كلمة المرور الجديدة</label>
            <input type="password" class="form-control" id="confirmNewPassword" required minlength="6">
          </div>
          <div style="display:flex; gap:1rem; margin-top:1.5rem;">
            <button type="submit" class="btn btn-primary" id="changePasswordBtn">تحديث كلمة المرور</button>
          </div>
        </form>
      `;
      
      document.getElementById('changePasswordForm').onsubmit = async (e) => {
        e.preventDefault();
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmNewPassword').value;
        
        if (newPass !== confirmPass) {
          showToast('كلمتا المرور غير متطابقتين', 'error');
          return;
        }
        
        const btn = document.getElementById('changePasswordBtn');
        btn.disabled = true; btn.textContent = 'جاري التحديث...';
        
        try {
          await updatePassword(newPass);
          showToast('تم تغيير كلمة المرور بنجاح');
          document.getElementById('changePasswordForm').reset();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          btn.disabled = false; btn.textContent = 'تحديث كلمة المرور';
        }
      };
    }



    // --- NAV & ROUTING ---
    const navLinks = document.querySelectorAll('.nav-link');
    const resetNav = () => navLinks.forEach(l => l.classList.remove('active'));

    function handleHashRoute() {
      const hash = window.location.hash || '#posts';
      resetNav();
      
      if (hash === '#sections') {
        const link = document.getElementById('navSections');
        if (link) link.classList.add('active');
        renderSectionsView();
      } else if (hash === '#users') {
        const link = document.getElementById('navUsers');
        if (link) link.classList.add('active');
        renderUsersView();
      } else if (hash === '#moderate') {
        const link = document.getElementById('navModerate');
        if (link) link.classList.add('active');
        renderPostsView(true);
      } else if (hash === '#settings') {
        const link = document.getElementById('navSettings');
        if (link) link.classList.add('active');
        renderSettingsView();
      } else if (hash === '#backup') {
        const link = document.getElementById('navBackup');
        if (link) link.classList.add('active');
        renderBackupView();
      } else if (hash === '#password') {
        const link = document.getElementById('navPassword');
        if (link) link.classList.add('active');
        renderPasswordView();

      } else {
        const link = document.getElementById('navPosts');
        if (link) link.classList.add('active');
        renderPostsView();
      }
    }

    window.addEventListener('hashchange', handleHashRoute);

    document.getElementById('navPosts').onclick = (e) => { e.preventDefault(); window.location.hash = '#posts'; };
    document.getElementById('navSections').onclick = (e) => { e.preventDefault(); window.location.hash = '#sections'; };
    
    const navUsers = document.getElementById('navUsers');
    if (navUsers) {
      navUsers.onclick = (e) => { e.preventDefault(); window.location.hash = '#users'; };
    }
    
    document.getElementById('navModerate').onclick = (e) => { e.preventDefault(); window.location.hash = '#moderate'; };
    document.getElementById('navPassword').onclick = (e) => { e.preventDefault(); window.location.hash = '#password'; };
    
    const navSettings = document.getElementById('navSettings');
    if (navSettings) {
      navSettings.onclick = (e) => { e.preventDefault(); window.location.hash = '#settings'; };
    }

    const navBackup = document.getElementById('navBackup');
    if (navBackup) {
      navBackup.onclick = (e) => { e.preventDefault(); window.location.hash = '#backup'; };
    }



    document.getElementById('logoutBtn').onclick = async () => { await signOut(); window.location.href = 'index.html'; };

    init();
  </script>
</body>
</html>
